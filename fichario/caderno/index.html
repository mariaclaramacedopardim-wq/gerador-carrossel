  if (!R) return '<p class="empty">Faça a primeira etapa e a análise aparece aqui.</p>';
  const weak = Object.values(st).filter(s => s.acc != null).sort((a, b) => a.acc - b.acc)[0];
  return `<div class="mini-ana"><div><b>${R.est}%</b><small>acerto estimado na prova</small></div><div><b>${R.cover}/6</b><small>áreas com dados</small></div></div>
    <p class="small" style="margin:10px 0 0">Ponto mais fraco agora: <b>${esc(weak.n)}</b> (${weak.acc}%).</p>`;
}
function dayCols() {
  const A = attemptsMiaps(), days = [];
  for (let i = 13; i >= 0; i--) { const d = addDays(today(), -i), xs = A.filter(a => a.d === d); days.push({ d, n: xs.length, ok: xs.filter(a => a.r === 'ok').length }); }
  const mx = Math.max(10, ...days.map(x => x.n));
  return `<div class="cols" role="img" aria-label="Questões por dia nos últimos 14 dias">${days.map(x => `<div class="col" title="${fmtShort(x.d)}: ${x.n} questões, ${x.ok} certas"><span class="stk"><i class="okp" style="height:${100 * x.ok / mx}%"></i><i class="errp" style="height:${100 * (x.n - x.ok) / mx}%"></i></span><small>${pd(x.d).getDate()}</small></div>`).join('')}</div>
    <p class="small muted" style="margin:6px 0 0"><span class="key okk"></span> certas <span class="key errk"></span> erradas ou "não sei"</p>`;
}
function recos(st) {
  const out = [], R = Object.values(st);
  const none = R.filter(s => !s.tot).sort((a, b) => b.w - a.w)[0];
  if (none) { const s = STAGES.find(x => stageArea(x) === none.k); out.push([`Você ainda não fez questões de <b>${esc(none.n)}</b>, que vale ${none.w}% da prova.`, s && `<button class="ghost" data-act="stageGo" data-id="${s.id}">Fazer agora</button>`]); }
  const gap = R.filter(s => s.acc != null && s.acc < 70).sort((a, b) => b.w * (100 - b.acc) - a.w * (100 - a.acc))[0];
  if (gap) { const s = STAGES.find(x => stageArea(x) === gap.k); out.push([`Maior ganho possível: <b>${esc(gap.n)}</b> (${gap.acc}% de acerto, peso ${gap.w}%).`, s && `<button class="ghost" data-act="stageGo" data-id="${s.id}">Treinar</button>`]); }
  const wr = wrongIds().length; if (wr) out.push([`${wr} questão(ões) erradas esperando para refazer.`, '<button class="ghost" data-act="errGo">Refazer</button>']);
  const os = OSCE_DRILLS.find(d => !drillLast(d.id)); if (os) out.push([`Estação de OSCE ainda não treinada: <b>${esc(os.name)}</b>.`, `<button class="ghost" data-act="drillGo" data-id="${os.id}">Treinar</button>`]);
  return out.slice(0, 4);
}
function analiseHTML() {
  const st = areaStats(), R = readiness(st), A = attemptsMiaps();
  const why = {}; A.filter(a => a.r === 'err').forEach(a => { const k = a.why || 'sem'; why[k] = (why[k] || 0) + 1; });
  const nerr = A.filter(a => a.r === 'err').length, nns = A.filter(a => a.r === 'ns').length;
  const withMs = A.filter(a => a.ms), sec = withMs.length ? Math.round(withMs.reduce((s, a) => s + Math.min(a.ms, 600000), 0) / withMs.length / 1000) : null;
  const cnt = {}; A.forEach(a => { if (a.r !== 'ok') cnt[a.qid] = (cnt[a.qid] || 0) + 1; });
  const Q = QMAP(), hard = Object.entries(cnt).filter(([, n]) => n >= 2).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const rc = recos(st);
  return `
  <div class="card banner ana-head">
    <div class="bignum"><b>${R ? R.est + '%' : '—'}</b><span class="rule"><i style="width:${R ? R.est : 0}%"></i><em style="left:70%"></em></span><small>acerto estimado · prova de 14/12</small></div>
    <div style="min-width:0"><div class="eyebrow">Análise das trilhas</div><h2>${R ? (R.est >= 70 ? 'No caminho para passar com folga' : R.est >= 55 ? 'Perto. O ganho está nas áreas fracas' : 'Ainda no começo. Errar agora é o que ensina') : 'Faça a primeira etapa da trilha'}</h2>
      <p class="small muted" style="margin:4px 0 0">${R ? `Média do acerto das últimas 20 questões de cada área, com o peso da prova. Baseada em ${R.cover} de 6 áreas (${R.wcover}% da prova)${R.cover < 6 ? '; as outras ainda não têm questões feitas' : ''}.` : 'A estimativa usa o peso de cada área na prova oficial de 2026.1.'} ${A.length} questões MIAPS respondidas${sec ? ` · ${sec}s por questão em média` : ''}.</p></div>
  </div>
  <div class="dash">
    <div class="card span7">${cardHead('target', 'pink', 'Por área da prova', '<span class="small muted">linha = 70%</span>')}
      <div class="areas">${BLUE.map(([k]) => { const s = st[k]; return `<div class="area"><div class="area-h"><b>${esc(s.n)} <small class="muted">· ${s.w}% da prova</small></b><span>${s.acc == null ? '—' : s.acc + '%'}</span></div>
        <span class="rule mk"><i style="width:${s.acc || 0}%"></i><em style="left:70%"></em></span>
        <small>${s.tot ? `${s.tot} respondidas · ${s.seen} de ${s.total} questões do banco vistas${s.trend != null ? ` · ${s.trend > 0 ? 'subindo ' + s.trend + ' pontos' : s.trend < 0 ? 'caindo ' + (-s.trend) + ' pontos' : 'estável'} nas últimas 10` : ''}` : 'sem questões feitas'}</small></div>`; }).join('')}</div></div>
    <div class="span5" style="display:grid;gap:18px;align-content:start">
      <div class="card">${cardHead('bulb', 'peach', 'O que fazer agora')}
        ${rc.length ? `<ol class="recos">${rc.map(([t, b]) => `<li><span>${t}</span>${b || ''}</li>`).join('')}</ol>` : '<p class="empty">Tudo em dia.</p>'}</div>
      <div class="card">${cardHead('flame', 'pink', 'Por que você erra', `<span class="pill">${nerr} erros · ${nns} não sei</span>`)}
        ${nerr ? `<table class="whytab"><tbody>${[...Object.keys(WHY), 'sem'].filter(k => why[k]).map(k => `<tr><td>${k === 'sem' ? '<span class="muted">sem motivo marcado</span>' : WHY[k]}</td><td class="num">${why[k]}</td><td class="num">${pct(why[k], nerr)}%</td></tr>`).join('')}</tbody></table>
        <p class="small muted" style="margin:8px 0 0">${(why.leit || 0) > (why.nao || 0) ? 'Muitos erros de leitura: sublinhe o que a questão pede (a correta, a incorreta, a primeira conduta).' : (why.conf || 0) >= (why.nao || 0) && why.conf ? 'Muita confusão entre condutas parecidas: os flashcards dos erros ajudam a separar.' : 'A maioria é conteúdo novo. É o esperado no começo de cada tema.'}</p>` : '<p class="empty">Nenhum erro ainda.</p>'}</div>
    </div>
    <div class="card span7">${cardHead('calendar', 'lilac', 'Últimos 14 dias')}${dayCols()}</div>
    <div class="card span5">${cardHead('repeat', 'sky', 'Errou 2 vezes ou mais')}
      ${hard.length ? `<ol class="rev-list">${hard.map(([id, n]) => `<li><p class="t">${esc(Q[id].q.slice(0, 140))}${Q[id].q.length > 140 ? '…' : ''}</p><p class="small"><b>${n}×</b> · certa: ${esc(Q[id].o[Q[id].a])}</p></li>`).join('')}</ol><button data-act="hardGo">Refazer estas</button>` : '<p class="empty">Nenhuma questão errada duas vezes.</p>'}</div>
    <div class="card span12">${cardHead('stetho', 'mint', 'Estações de OSCE', '<a class="link" href="#trilhas">Treinar ›</a>')}
      <div class="tablewrap"><table><thead><tr><th>Estação</th><th class="num">Última nota</th><th class="num">Treinos</th><th>Itens que você mais esquece</th></tr></thead><tbody>
      ${OSCE_DRILLS.map(d => { const h = (S.drills || {})[d.id] || [], l = h[h.length - 1]; const miss = {}; h.forEach(x => (x.miss || []).forEach(i => miss[i] = (miss[i] || 0) + 1)); const top = Object.entries(miss).sort((a, b) => b[1] - a[1]).slice(0, 2).map(([i]) => d.itens[i]);
        return `<tr><td>${esc(d.name)}</td><td class="num">${l ? pct(l.got, l.tot) + '%' : '—'}</td><td class="num">${h.length}</td><td class="small">${top.length ? top.map(t => esc(t.length > 80 ? t.slice(0, 80) + '…' : t)).join('<br>') : '<span class="muted">—</span>'}</td></tr>`; }).join('')}
      </tbody></table></div></div>
  </div>
  <h3 class="sub-h" style="margin-top:34px">Visão geral do caderno</h3>`;
}

// ----- Eventos -----
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'stageGo') return startStage(b.dataset.id);
  if (a === 'runPick') return runAnswer(b.dataset.i === 'ns' ? null : +b.dataset.i);
  if (a === 'runWhy') return runWhy(b.dataset.k);
  if (a === 'runNext') { RUN.i++; RUN.qStart = Date.now(); rTrilhas(); return window.scrollTo(0, 0); }
  if (a === 'runQuit') { RUN.qs = RUN.qs.slice(0, RUN.res.filter(Boolean).length); RUN.i = RUN.qs.length; return rTrilhas(); }
  if (a === 'runClose') { RUN = null; return rTrilhas(); }
  if (a === 'runRedo') { const qs = RUN.qs.filter((_, i) => RUN.res[i] && RUN.res[i].r !== 'ok'); return startRun(qs, 'Refazendo os erros', { kind: 'erros' }); }
  if (a === 'errGo') { const Q = QMAP(); return startRun(shuffle(wrongIds().map(id => Q[id])).slice(0, 10), 'Meus erros', { kind: 'erros' }); }
  if (a === 'hardGo') { const Q = QMAP(), cnt = {}; S.attempts.forEach(x => { if (x.r !== 'ok' && Q[x.qid]) cnt[x.qid] = (cnt[x.qid] || 0) + 1; }); return startRun(Object.keys(cnt).filter(id => cnt[id] >= 2).map(id => Q[id]).slice(0, 10), 'Questões difíceis', { kind: 'erros' }); }
  if (a === 'drillGo') { DRILL = { id: b.dataset.id, shown: false, got: [], ans: '' }; location.hash = '#trilhas'; rTrilhas(); return window.scrollTo(0, 0); }
  if (a === 'drillShow') { DRILL.ans = $('#drillAns').value; DRILL.shown = true; return rTrilhas(); }
  if (a === 'drillQuit') { DRILL = null; return rTrilhas(); }
  if (a === 'drillSave') {
    const d = OSCE_DRILLS.find(x => x.id === DRILL.id), got = d.itens.filter((_, i) => DRILL.got[i]).length;
    S.drills = S.drills || {}; (S.drills[d.id] = S.drills[d.id] || []).push({ d: today(), got, tot: d.itens.length, miss: d.itens.map((_, i) => i).filter(i => !DRILL.got[i]) });
    S.osce = S.osce || {}; S.osce[d.st] = today();
    d.itens.forEach((it, i) => { if (!DRILL.got[i]) S.cards.push({ id: uid(), f: `OSCE · ${d.name}: o que faltou dizer?`, b: it, t: 'osce', due: addDays(today(), 1), ivl: 0, ease: 2.5, reps: 0, lapses: 0, created: today() }); });
    save(); toast(`Estação salva: ${got} de ${d.itens.length}.${got < d.itens.length ? ` ${d.itens.length - got} item(ns) viraram flashcard.` : ''}`);
    DRILL = null; return rTrilhas();
  }
  if (a === 'acRun') { const t = $('#acT').value; const n = SIZES[acSize][4]; const pool = bank().filter(q => q.t === t); if (!pool.length) return toast('Este tema ainda não tem questões no banco. Registre as que fez fora.'); return startRun(pickFrom(pool, Math.min(n, pool.length)), `Modo ação · ${topic(t).name}`, { kind: 'acao', t, size: acSize }); }
});
document.addEventListener('change', e => {
  if (e.target.dataset.act !== 'drillChk' || !DRILL) return;
  DRILL.got[+e.target.dataset.i] = e.target.checked;
  const d = OSCE_DRILLS.find(x => x.id === DRILL.id), btn = document.querySelector('[data-act="drillSave"]');
  if (btn) btn.textContent = `Salvar nota: ${DRILL.got.filter(Boolean).length} de ${d.itens.length}`;
});
document.addEventListener('submit', e => {
  if (e.target.dataset.form !== 'temaGo') return; e.preventDefault();
  const t = $('#tgT').value, n = +$('#tgN').value;
  startRun(pickFrom(bank().filter(q => q.t === t), n), topic(t).name, { kind: 'tema', t });
});
function trilhaHomeHTML() {
  const nx = nextStage(), i = STAGES.indexOf(nx), wr = wrongIds().length, R = readiness(areaStats());
  return `<div class="card tr-home">
    ${cardHead('path', 'pink', 'Trilhas de questões', '<a class="link" href="#trilhas">Abrir ›</a>')}
    <p class="small" style="margin:0 0 10px">Próxima: <b>Etapa ${i + 1} · ${esc(nx.name)}</b> <span class="muted">(${stageN(nx)} questões)</span>${R ? ` · acerto estimado <b>${R.est}%</b>` : ''}</p>
    <div class="row"><button class="primary" data-act="stageGo" data-id="${nx.id}">Começar etapa ${i + 1}</button>${wr ? `<button data-act="errGo">Refazer ${Math.min(10, wr)} erros</button>` : ''}</div>
  </div>`;
}

// ===== Início =====
load();
document.querySelectorAll('#tabs a').forEach(a => { a.insertAdjacentHTML('afterbegin', ic(a.dataset.ic)); if (ANA[a.dataset.ic]) a.style.setProperty('--ana', `var(--a-${ANA[a.dataset.ic]})`); });
$('#logoMark').innerHTML = ic('heart');
document.querySelector('.main-inner').insertAdjacentHTML('afterbegin', `<svg class="seal" viewBox="0 0 120 120" aria-hidden="true"><defs><path id="sealP" d="M60 60m-44 0a44 44 0 1 1 88 0a44 44 0 1 1-88 0"/></defs><circle cx="60" cy="60" r="57" fill="var(--seal-bg)"/><circle cx="60" cy="60" r="31" fill="none" stroke="var(--seal-ink)" stroke-width=".8"/><g class="seal-rot"><text font-size="9.6" letter-spacing="2.2" fill="var(--seal-ink)" font-family="Schibsted Grotesk, sans-serif" font-weight="700"><textPath href="#sealP">CADERNO DA MARIA · MEDICINA · 2026 ·</textPath></text></g><text x="60" y="70" text-anchor="middle" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="30" fill="var(--seal-ink)">M</text></svg>`);
$('#todayPill').innerHTML = ic('calendar') + ' ' + fmtLong(today());
window.addEventListener('hashchange', route);
route();
new MutationObserver(() => applyAna()).observe(document.querySelector('main'), { childList: true, subtree: true });
</script></body></html>
