<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fffaf8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Caderno"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest">
<title>Caderno da Maria</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app de desktop com menu lateral fixo e painel de cartões em tons pastel; no celular o menu vira barra de pílulas no topo */
:root{
  --bg:#fbf4f7; --surface:#ffffff; --surface2:#fdf0f5; --ink:#3a2433; --muted:#94788a; --line:#f3dfe8;
  --accent:#e2457a; --accent-ink:#ffffff; --accent-2:#f48fb1;
  --pink:#fde3ee; --pink-ink:#c2336a; --lilac:#ede7fc; --lilac-ink:#7a5bd6; --peach:#fdebdc; --peach-ink:#c46a2b;
  --mint:#e2f4e8; --mint-ink:#2f8a55; --sky:#e4edfc; --sky-ink:#3f6fc9;
  --bar-pink:#f08bb0; --bar-lilac:#b8a2f2; --bar-peach:#f5b17f; --bar-mint:#73c995; --bar-sky:#8fb2ef; --bar-rose:#e88aa0; --bar-grey:#cdbfc8;
  --hero1:#3b2a6b; --hero2:#5b3f8f; --hero-ink:#f6efff; --hero-sub:#c9b8f0;
  --ok:#2f8a55; --ok-soft:#e2f4e8; --warn:#b06a12; --warn-soft:#fdf0dc; --bad:#d23a5a; --bad-soft:#fde3e8;
  --shadow:0 1px 2px rgba(120,40,80,.05),0 6px 20px rgba(160,60,110,.07);
  --display:'Poppins','Avenir Next','Segoe UI',system-ui,sans-serif;
  --body:'Nunito','Segoe UI',system-ui,-apple-system,sans-serif;
  --r:20px; --side:248px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171017; --surface:#221822; --surface2:#2b1f2b; --ink:#f8e9f1; --muted:#c29fb4; --line:#3a2a38;
  --accent:#ff6f9f; --accent-ink:#2a0d1a; --accent-2:#ff9fc0;
  --pink:#3b1f2d; --pink-ink:#ff9cc0; --lilac:#2c2448; --lilac-ink:#c3b0ff; --peach:#3a2a1d; --peach-ink:#f6b98a;
  --mint:#1b3326; --mint-ink:#7fd9a2; --sky:#1e2a44; --sky-ink:#9dbcf5;
  --bar-pink:#f07aa6; --bar-lilac:#a68ef0; --bar-peach:#e99a63; --bar-mint:#5fbf86; --bar-sky:#6f98e6; --bar-rose:#d77790; --bar-grey:#6c5a66;
  --hero1:#2a1f52; --hero2:#3f2c70; --hero-ink:#f6efff; --hero-sub:#b9a6ea;
  --ok:#7fd9a2; --ok-soft:#1b3326; --warn:#f1b65c; --warn-soft:#3a2a12; --bad:#ff7d95; --bad-soft:#3d1823;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171017; --surface:#221822; --surface2:#2b1f2b; --ink:#f8e9f1; --muted:#c29fb4; --line:#3a2a38;
  --accent:#ff6f9f; --accent-ink:#2a0d1a; --accent-2:#ff9fc0;
  --pink:#3b1f2d; --pink-ink:#ff9cc0; --lilac:#2c2448; --lilac-ink:#c3b0ff; --peach:#3a2a1d; --peach-ink:#f6b98a;
  --mint:#1b3326; --mint-ink:#7fd9a2; --sky:#1e2a44; --sky-ink:#9dbcf5;
  --bar-pink:#f07aa6; --bar-lilac:#a68ef0; --bar-peach:#e99a63; --bar-mint:#5fbf86; --bar-sky:#6f98e6; --bar-rose:#d77790; --bar-grey:#6c5a66;
  --hero1:#2a1f52; --hero2:#3f2c70; --hero-ink:#f6efff; --hero-sub:#b9a6ea;
  --ok:#7fd9a2; --ok-soft:#1b3326; --warn:#f1b65c; --warn-soft:#3a2a12; --bad:#ff7d95; --bad-soft:#3d1823;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---- Estrutura de app ---- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
aside.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:24px 16px 20px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px;border-right:1px solid var(--line);background:var(--surface)}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px}
.logo .mark{width:38px;height:38px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.logo b{font-family:var(--display);font-weight:700;font-size:1.02rem;line-height:1.1;display:block}
.logo span{font-size:.8rem;color:var(--muted)}
nav.tabs{display:flex;flex-direction:column;gap:4px}
nav.tabs a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;color:var(--muted);text-decoration:none;font-weight:700;font-size:.95rem}
nav.tabs a:hover{background:var(--surface2);color:var(--ink)}
nav.tabs a[aria-current="page"]{background:var(--pink);color:var(--pink-ink)}
.side-foot{margin-top:auto;display:grid;gap:10px}
.side-card{background:var(--lilac);color:var(--ink);border-radius:16px;padding:14px;font-size:.85rem}
.side-card b{display:block;font-family:var(--display);font-weight:600;color:var(--lilac-ink)}
main{min-width:0;padding-block:26px 64px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.main-inner{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.topbar h1{font-family:var(--display);font-weight:700;font-size:1.65rem;margin:0;line-height:1.15;text-wrap:balance}
.topbar p{margin:2px 0 0;color:var(--muted)}
.datepill{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:700;font-size:.9rem;color:var(--pink-ink);box-shadow:var(--shadow)}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside.side{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:auto;flex-direction:column;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line)}
  .logo{display:none}.side-foot{display:none}
  nav.tabs{flex-direction:row;overflow-x:auto;scrollbar-width:none;gap:6px}
  nav.tabs a{flex:none;padding:8px 12px;font-size:.88rem;gap:8px}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px}
}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px}

/* ---- Tipografia e blocos ---- */
section.view{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
section.view>*{min-width:0}
h2{font-family:var(--display);font-weight:700;font-size:1.4rem;margin:0;line-height:1.2;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:1.02rem;margin:0;line-height:1.3}
.eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.card{background:var(--surface);border-radius:var(--r);padding:20px;min-width:0;box-shadow:var(--shadow)}
.soft{background:var(--surface2);border-radius:16px;padding:14px 16px;min-width:0}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card-head h3{flex:1;min-width:0}
.ico{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none}
.t-pink{background:var(--pink);color:var(--pink-ink)}.t-lilac{background:var(--lilac);color:var(--lilac-ink)}.t-peach{background:var(--peach);color:var(--peach-ink)}.t-mint{background:var(--mint);color:var(--mint-ink)}.t-sky{background:var(--sky);color:var(--sky-ink)}
.link{color:var(--accent);font-weight:700;text-decoration:none;font-size:.88rem;background:none;border:0;padding:0;cursor:pointer}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:14px}
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px;align-items:start}
.stack>.pill{justify-self:start}
.dash>*{min-width:0}
.span4{grid-column:span 4}.span5{grid-column:span 5}.span6{grid-column:span 6}.span7{grid-column:span 7}.span8{grid-column:span 8}.span12{grid-column:span 12}
@media (max-width:1100px){.span4,.span5,.span7{grid-column:span 6}.span8{grid-column:span 12}}
@media (max-width:700px){.dash>*{grid-column:span 12!important}}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.row>*{min-width:0}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}

/* ---- Controles ---- */
button,.btn{font:inherit;font-weight:700;font-size:.9rem;cursor:pointer;border-radius:14px;padding:9px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:8px}
button:hover,.btn:hover{border-color:var(--accent-2)}
button.primary,.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.soft-btn,.btn.soft-btn{background:var(--pink);color:var(--pink-ink);border-color:transparent}
button.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:6px 8px}
button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 11px;max-width:100%}
select{text-overflow:ellipsis}
input[type="file"]{width:100%}
textarea{width:100%;min-height:90px;resize:vertical}
input[type="number"]{width:5.5em}
label.inline{display:inline-flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;font-size:.74rem;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--pink);color:var(--pink-ink);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.lilac{background:var(--lilac);color:var(--lilac-ink)}.pill.peach{background:var(--peach);color:var(--peach-ink)}.pill.mint{background:var(--mint);color:var(--mint-ink)}.pill.sky{background:var(--sky);color:var(--sky-ink)}

/* ---- Itens de lista (agenda, revisões) ---- */
.list{display:grid;gap:8px}
.item+.item{margin-top:8px}
.list>.item+.item{margin-top:0}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px 12px;align-items:start;padding:12px 14px;border-radius:16px;background:var(--surface2)}
.item input[type="checkbox"]{width:22px;height:22px;accent-color:var(--accent);margin-top:2px}
.item .t{font-weight:800;min-width:0;overflow-wrap:anywhere}
.item .small{overflow-wrap:anywhere}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.item .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.item .act{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.item{grid-template-columns:auto minmax(0,1fr)}.item .act{grid-column:2;justify-content:flex-start}}
.day{display:grid;gap:10px}
.dayhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px}
.dayhead h3 span{color:var(--muted);font-weight:500}
.day.is-today{outline:2px solid var(--accent-2)}
.score{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.score input{width:6.2em;padding:5px 9px}

/* ---- Dashboard ---- */
.hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:var(--hero-ink);border-radius:24px;padding:24px;display:flex;flex-wrap:wrap;align-items:center;gap:22px;box-shadow:var(--shadow)}
.hero>div{min-width:0;flex:1 1 260px}
.hero .eyebrow{color:var(--hero-sub)}
.hero h2{color:var(--hero-ink);font-size:1.5rem}
.hero p{margin:4px 0 0;color:var(--hero-sub)}
.hero .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.hero .chip{background:rgba(255,255,255,.13);color:var(--hero-ink);border-radius:999px;padding:5px 12px;font-size:.82rem;font-weight:700}
.hero .ring{flex:0 0 auto}
.kpi{background:var(--surface);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);display:grid;gap:4px;align-content:start}
.kpi .lab{display:flex;align-items:center;gap:8px;font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .lab .ico{width:28px;height:28px;border-radius:9px}
.kpi .lab svg.i{width:16px;height:16px}
.kpi b{font-family:var(--display);font-weight:700;font-size:1.7rem;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:.84rem;color:var(--muted)}
.bars{display:grid;gap:14px}
.bar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.bar .dot{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;grid-row:span 2}
.bar .dot svg.i{width:16px;height:16px}
.bar .name{font-weight:700;font-size:.92rem;min-width:0}
.bar .name small{color:var(--muted);font-weight:600}
.bar .v{font-weight:800;font-variant-numeric:tabular-nums;text-align:right;grid-row:span 2;align-self:center}
.bar .track{height:10px;border-radius:999px;background:var(--surface2);overflow:hidden}
.bar .fill{height:100%;border-radius:999px}
.donut-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:20px}
.legend{display:grid;gap:9px;flex:1 1 180px;min-width:0}
.legend div{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.9rem}
.legend i{width:12px;height:12px;border-radius:50%}
.legend b{font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

/* ---- Simulado e flashcards ---- */
.q-card{display:grid;gap:14px}
.q-meta{font-size:.76rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--pink-ink)}
.q-text{font-weight:800;font-size:1.08rem}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.opt{justify-content:flex-start;text-align:left;font-weight:600;padding:13px 15px;background:var(--surface2);border-color:transparent;line-height:1.35}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:800}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.feedback{border-radius:14px;padding:12px 14px;background:var(--lilac)}
.progress{height:8px;background:var(--surface);border-radius:999px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);border-radius:999px}
.fc{min-height:200px;display:grid;place-items:center;text-align:center;padding:30px;font-size:1.15rem}
.fc .back{border-top:1px dashed var(--line);margin-top:16px;padding-top:16px;font-weight:800}
.mn{display:grid;gap:6px}
.mn p{margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:20;max-width:calc(100% - 32px)}
details summary{cursor:pointer;font-weight:800;color:var(--accent)}
.chk{display:flex;flex-wrap:wrap;gap:6px}
.chk label{display:inline-flex;gap:6px;align-items:center;background:var(--surface2);padding:6px 11px;border-radius:999px;font-size:.86rem}
.chk input{accent-color:var(--accent)}
.empty{color:var(--muted);font-style:italic;margin:0}
code{background:var(--surface2);padding:1px 5px;border-radius:6px;font-size:.88em}
@media (prefers-reduced-motion:no-preference){.fill,.progress>i{transition:width .5s ease}}

/* ===== Tema "caderno clean" com toques maximalistas (laços, vichy, gravuras anatômicas) ===== */
:root{
  --bg:#fffaf8; --surface:#ffffff; --surface2:#fdf3f5; --ink:#2e1c24; --muted:#8c7179; --line:#f0e1e5;
  --accent:#c93d6e; --accent-ink:#ffffff; --accent-2:#ee9ab6; --cherry:#e0314f;
  --blush:#fde7ee; --ging:rgba(226,104,146,.16); --scallop:#fde7ee;
  --pink:#fde7ee; --pink-ink:#b5305f;
  --hero1:#fde7ee; --hero2:#fbdbe5; --hero-ink:#5e1a35; --hero-sub:#9a5b72; --hero-track:rgba(181,48,95,.14); --hero-chip:rgba(255,255,255,.7);
  --shadow:none; --lift:0 10px 24px -14px rgba(150,40,80,.35);
  --display:'Instrument Serif','Cormorant Garamond',Georgia,serif;

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171014; --surface:#20171c; --surface2:#2a1e24; --ink:#f8eaef; --muted:#c3a3af; --line:#3a2a32;
  --accent:#ff7aa5; --accent-ink:#2a0c19; --accent-2:#ff9fc0; --cherry:#ff6b81;
  --blush:#2e1b24; --ging:rgba(255,140,180,.09); --scallop:#2e1b24; --pink:#3a1f2c; --pink-ink:#ffa3c4;
  --hero1:#2e1b24; --hero2:#3a2030; --hero-ink:#ffe3ee; --hero-sub:#d6a4b8; --hero-track:rgba(255,255,255,.1); --hero-chip:rgba(255,255,255,.08);
  --lift:0 10px 24px -14px rgba(0,0,0,.7)}}
:root[data-theme="dark"]{
  --bg:#171014; --surface:#20171c; --surface2:#2a1e24; --ink:#f8eaef; --muted:#c3a3af; --line:#3a2a32;
  --accent:#ff7aa5; --accent-ink:#2a0c19; --accent-2:#ff9fc0; --cherry:#ff6b81;
  --blush:#2e1b24; --ging:rgba(255,140,180,.09); --scallop:#2e1b24; --pink:#3a1f2c; --pink-ink:#ffa3c4;
  --hero1:#2e1b24; --hero2:#3a2030; --hero-ink:#ffe3ee; --hero-sub:#d6a4b8; --hero-track:rgba(255,255,255,.1); --hero-chip:rgba(255,255,255,.08);
  --lift:0 10px 24px -14px rgba(0,0,0,.7)}

body{font-size:15px;letter-spacing:-.005em}
.gingham,.banner,.side-card{background-color:var(--blush);background-image:linear-gradient(90deg,var(--ging) 50%,transparent 50%),linear-gradient(var(--ging) 50%,transparent 50%);background-size:20px 20px}

/* títulos em serifa editorial */
h2,h3,.topbar h1,.logo b,.kpi b,.side-card b{font-family:var(--display);font-weight:400;letter-spacing:0}
.topbar h1{font-size:2.5rem;line-height:1.05}
.topbar h1::after{content:"";display:inline-block;width:.95em;height:.95em;margin-left:.18em;vertical-align:-.1em;background:var(--st-cereja) center/contain no-repeat;transform:rotate(12deg)}
.topbar p{font-size:.95rem}
h2{font-size:1.85rem;line-height:1.1}
h3{font-size:1.35rem;line-height:1.15}
.eyebrow,.q-meta,.kpi .lab,th{letter-spacing:.16em;font-weight:700;font-size:.68rem}
.q-text{font-weight:700}

/* menu lateral */
aside.side{background:var(--bg)}
.logo .mark{width:46px;height:46px;border-radius:0;background:var(--st-laco) center/contain no-repeat;transform:rotate(-8deg)}
.logo .mark svg{display:none}
.logo b{font-size:1.45rem;line-height:1}
.logo span{font-size:.78rem;white-space:nowrap}
nav.tabs a{font-weight:600;border-radius:999px;padding:9px 14px}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}
nav.tabs a[aria-current="page"] svg.i{color:var(--accent-2)}
.side-card{position:relative;border:1px solid var(--line);border-radius:16px;padding:16px 14px 14px;color:var(--ink)}
.side-card b{color:var(--pink-ink);font-size:1.25rem}
.side-card::before{content:"";position:absolute;top:-22px;right:-6px;width:52px;height:52px;background:var(--st-laco) center/contain no-repeat;transform:rotate(14deg)}
.datepill{background:transparent;box-shadow:none;border-color:var(--ink);color:var(--ink);font-weight:600}

/* cartões: planos, traço fino */
.card,.kpi{box-shadow:none;border:1px solid var(--line);border-radius:var(--r)}
a.card{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
a.card:hover{transform:translateY(-2px);box-shadow:var(--lift);border-color:var(--accent-2)}
.ico{border-radius:50%}
.soft,.item,.opt{background:var(--surface2)}

/* faixa do dia: vichy com borda de babado e o coração anatômico */
.banner{position:relative;border:0;margin-bottom:12px;padding-right:130px}
.banner::before{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;background:radial-gradient(circle at 10px 0,var(--scallop) 9.5px,transparent 10px) 0 0/20px 10px repeat-x}
.banner::after{content:"";position:absolute;right:18px;top:50%;width:118px;height:118px;margin-top:-66px;background:var(--st-coracao) center/contain no-repeat;transform:rotate(8deg);pointer-events:none}
.banner h2{font-style:italic;font-size:2rem}
@media (max-width:560px){.banner{padding-right:20px;padding-top:24px}.banner::after{width:74px;height:74px;top:-18px;margin-top:0;right:8px}}

/* painel de desempenho */
.hero{position:relative;background-color:var(--hero1);background-image:linear-gradient(90deg,var(--ging) 50%,transparent 50%),linear-gradient(var(--ging) 50%,transparent 50%);background-size:20px 20px;color:var(--hero-ink);border:1px solid var(--line);box-shadow:none;padding-right:120px}
.hero h2{font-size:2.1rem;font-style:italic}
.hero .chip{background:var(--hero-chip);color:var(--hero-ink);border:1px solid var(--line)}
.hero::after{content:"";position:absolute;right:-10px;top:-26px;width:132px;height:132px;background:var(--st-cerebro) center/contain no-repeat;transform:rotate(-6deg);pointer-events:none}
@media (max-width:700px){.hero{padding-right:24px;padding-top:56px}.hero::after{width:90px;height:90px;top:-22px;right:4px}}

/* flashcard com cerejas */
.fc{position:relative;font-family:var(--display);font-size:1.6rem;line-height:1.25;background:var(--surface)}
.fc .back{font-family:var(--body);font-size:1.05rem;font-weight:700;color:var(--pink-ink)}
.fc::after{content:"";position:absolute;right:-12px;top:-18px;width:64px;height:64px;background:var(--st-cereja) center/contain no-repeat;transform:rotate(14deg)}

/* botões e etiquetas */
button,.btn{border-radius:999px;font-weight:700}
button.primary,.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
button.primary:hover,.btn.primary:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.soft-btn,.btn.soft-btn{background:var(--blush);color:var(--pink-ink)}
.pill{font-weight:700;letter-spacing:.02em}
input,select,textarea{border-radius:12px;background:var(--surface)}
.item input[type="checkbox"],.chk input{accent-color:var(--cherry)}
.day.is-today{outline:0;border:1.5px solid var(--accent)}
.link,details summary{color:var(--accent)}
details summary{font-family:var(--display);font-size:1.25rem;font-weight:400}
.empty{font-family:var(--display);font-size:1.15rem}
.progress>i{background:linear-gradient(90deg,var(--accent-2),var(--cherry))}
::selection{background:var(--accent-2);color:#2e1c24}
@media (max-width:900px){.topbar h1{font-size:2.1rem}aside.side{background:var(--bg)}}
</style>

// Sequência da agenda a partir de 03/11: conteúdo da faculdade intercalado (Clínica Médica e MIAPS),
// com uma revisão intercalada a cada 8 temas; depois, o restante do planejamento de 120 dias.
const PLAN_DROP = new Set(['cm-valv','rev-1','cm-asma','cm-dpoc','cm-pnm','cm-tb','rev-2','rev-3','rev-4','rev-5','rev-6','cm-eletro','cm-acido','cm-lra','cm-drc','cm-glom','cm-dm','cm-tireo','cm-esof','cm-dii','cm-choque','cm-derm','cm-geri','cm-atb']);
const SEQ = (() => {
  const out = []; let i = 0, j = 0, n = 0, k = 0;
  while (i < FAC_CM.length || j < FAC_MIAPS.length) {
    const pick = (n % 2 === 0 && i < FAC_CM.length) || j >= FAC_MIAPS.length ? FAC_CM[i++] : FAC_MIAPS[j++];
    out.push([pick[0], pick[1], pick[2], pick[3], 't', pick[4]]); n++;
    if (n % 8 === 0) { k++; out.push(['rev-f' + k, `Revisão intercalada ${k}: 40 questões dos últimos 8 temas`, 'cm', 'Revisões da faculdade', 'r', '']); }
  }
  if (n % 8) { k++; out.push(['rev-f' + k, `Revisão intercalada ${k}: temas finais da faculdade`, 'cm', 'Revisões da faculdade', 'r', '']); }
  PLAN.filter(p => !PLAN_DROP.has(p[0])).forEach(p => out.push([p[0], p[1], p[2], p[3], p[4], '']));
  return out;
})();

{id:'has1',t:'cm-has',q:'Homem de 45 anos, assintomático, tem PA de 148/94 mmHg e 146/92 mmHg em duas consultas. Exame físico e ECG normais. Qual a melhor conduta para confirmar o diagnóstico?',o:['Iniciar terapia dupla imediatamente','Solicitar MAPA ou MRPA','Solicitar ecocardiograma','Repetir a medida apenas em 1 ano','Dosar aldosterona e renina'],a:1,c:'PA de consultório no estágio 1 sem lesão de órgão-alvo: confirmar fora do consultório (MAPA ou MRPA) para afastar o efeito do avental branco antes de rotular como hipertenso.',f:['PA 140–159/90–99 no consultório, sem LOA: como confirmar HAS?','MAPA ou MRPA (afasta avental branco e identifica HAS mascarada).']},
{id:'has2',t:'cm-has',q:'Mulher de 58 anos chega à UPA com PA de 210/120 mmHg e cefaleia leve. Sem dor torácica, déficit neurológico, dispneia ou alteração de função renal. Qual a conduta mais adequada?',o:['Nitroprussiato de sódio IV em UTI','Nifedipino sublingual para queda rápida','Anti-hipertensivo oral e redução gradual da PA em 24–48 h, com seguimento','Labetalol IV com meta de PA normal em 1 hora','Alta sem medicação, pois não há sintomas'],a:2,c:'Sem lesão aguda de órgão-alvo é urgência hipertensiva (ou pseudocrise): reduzir gradualmente com medicação oral. Nifedipino sublingual é contraindicado (queda abrupta e imprevisível, risco de isquemia).',f:['Urgência × emergência hipertensiva: o que diferencia?','Emergência tem lesão aguda de órgão-alvo (droga IV, UTI). Urgência não tem: VO e redução gradual em 24–48 h.']},
{id:'has3',t:'cm-has',q:'Em hipertenso sem comorbidades, qual classe NÃO é preferencial como monoterapia inicial?',o:['Diurético tiazídico','Bloqueador dos canais de cálcio di-hidropiridínico','IECA','BRA','Betabloqueador'],a:4,c:'As classes preferenciais são tiazídico, BCC, IECA e BRA. O betabloqueador fica para indicações específicas (IC, pós-IAM, angina, controle de FC).',f:['4 classes preferenciais para iniciar tratamento da HAS','Tiazídico, BCC, IECA e BRA. Betabloqueador só com indicação específica.']},
{id:'has4',t:'cm-has',q:'Homem de 42 anos com HAS resistente e potássio de 3,1 mEq/L sem uso de diurético. Qual o melhor exame de rastreio para a causa mais provável?',o:['Metanefrinas plasmáticas','Cortisol salivar noturno','Relação aldosterona/renina','Doppler de artérias renais','TSH'],a:2,c:'HAS resistente com hipocalemia espontânea sugere hiperaldosteronismo primário. O rastreio é a relação aldosterona/atividade de renina.',f:['HAS + hipocalemia espontânea: qual causa secundária e qual rastreio?','Hiperaldosteronismo primário; relação aldosterona/renina.']},
{id:'has5',t:'cm-has',q:'Qual associação de anti-hipertensivos deve ser evitada por aumentar risco de hipercalemia e lesão renal sem benefício cardiovascular?',o:['IECA + tiazídico','BRA + anlodipino','IECA + BRA','Anlodipino + clortalidona','Tiazídico + espironolactona'],a:2,c:'O duplo bloqueio do SRAA (IECA + BRA, ou com alisquireno) aumenta hipercalemia e LRA sem reduzir eventos.',f:['Associação proibida no tratamento da HAS','IECA + BRA (duplo bloqueio do SRAA).']},
// --- Dislipidemia
{id:'dlp1',t:'cm-dlp',q:'Mulher de 35 anos, sem outras doenças, tem LDL-c de 210 mg/dL. O pai teve IAM aos 48 anos. Qual a conduta?',o:['Calcular escore de risco antes de decidir','Apenas mudança de estilo de vida por 6 meses','Estatina de alta intensidade','Fibrato','Ômega-3'],a:2,c:'LDL ≥ 190 mg/dL sugere hipercolesterolemia familiar e já classifica como alto risco: estatina de alta intensidade, sem precisar de escore.',f:['LDL ≥ 190 mg/dL: precisa calcular escore de risco?','Não. Já é alto risco (provável HF): estatina de alta intensidade.']},
{id:'dlp2',t:'cm-dlp',q:'Paciente em uso de sinvastatina refere dor muscular intensa. CK de 12 vezes o limite superior. Conduta:',o:['Manter a dose e repetir CK em 3 meses','Suspender a estatina','Reduzir a dose pela metade','Associar fibrato','Trocar por outra estatina no mesmo dia'],a:1,c:'Mialgia com CK > 10× o LSN exige suspensão da estatina (risco de rabdomiólise). Reintroduzir depois, com outra estatina ou dose menor, se indicado.',f:['Estatina + mialgia com CK > 10× LSN','Suspender (risco de rabdomiólise).']},
{id:'dlp3',t:'cm-dlp',q:'Paciente com triglicerídeos de 1.200 mg/dL. Qual a principal complicação a prevenir e o fármaco de escolha?',o:['IAM; estatina','Pancreatite aguda; fibrato','Esteatose; metformina','AVC; ezetimiba','Xantomas; resina'],a:1,c:'TG muito alto (acima de ~880–1.000 mg/dL) traz risco de pancreatite aguda: fibrato e dieta com restrição de gordura e álcool.',f:['TG > 1.000 mg/dL: risco e tratamento','Pancreatite aguda; fibrato + dieta.']},
{id:'dlp4',t:'cm-dlp',q:'Qual o mecanismo de ação da ezetimiba?',o:['Inibe a HMG-CoA redutase','Inibe a PCSK9','Inibe a absorção intestinal de colesterol (NPC1L1)','Ativa o PPAR-alfa','Sequestra ácidos biliares'],a:2,c:'Ezetimiba bloqueia o transportador NPC1L1 no enterócito. Estatina inibe HMG-CoA redutase; fibrato ativa PPAR-alfa.',f:['Mecanismo da ezetimiba','Inibe a absorção intestinal de colesterol (NPC1L1).']},
{id:'dlp5',t:'cm-dlp',q:'Colesterol total 240 mg/dL, HDL 40 mg/dL e TG 200 mg/dL. Pela fórmula de Friedewald, o LDL é:',o:['120 mg/dL','140 mg/dL','160 mg/dL','180 mg/dL','200 mg/dL'],a:2,c:'LDL = CT − HDL − TG/5 = 240 − 40 − 40 = 160 mg/dL. A fórmula perde validade com TG > 400 mg/dL.',f:['Fórmula de Friedewald','LDL = CT − HDL − TG/5 (não vale se TG > 400).']},
// --- IC
{id:'ic1',t:'cm-ic',q:'Na IC com fração de ejeção reduzida, qual fármaco alivia sintomas mas NÃO reduz mortalidade?',o:['Sacubitril-valsartana','Carvedilol','Espironolactona','Dapagliflozina','Furosemida'],a:4,c:'Os 4 pilares que reduzem mortalidade: IECA/BRA/INRA, betabloqueador, antagonista mineralocorticoide e iSGLT2. Diurético de alça só trata congestão.',f:['4 pilares da ICFEr','INRA (ou IECA/BRA) + betabloqueador + espironolactona + iSGLT2. Furosemida só alivia congestão.']},
{id:'ic2',t:'cm-ic',q:'Paciente com IC descompensada: extremidades quentes, PA 140/90, estertores, edema e turgência jugular. Perfil e conduta:',o:['Frio e seco; volume','Quente e úmido; diurético IV e vasodilatador','Frio e úmido; inotrópico sem diurético','Quente e seco; ajustar medicação oral','Frio e seco; dobutamina'],a:1,c:'Bem perfundido (quente) e congesto (úmido) = perfil B, o mais comum. Tratamento: diurético de alça IV e vasodilatador.',f:['Perfil hemodinâmico mais comum da IC descompensada e conduta','Quente e úmido (B): diurético IV + vasodilatador.']},
{id:'ic3',t:'cm-ic',q:'Paciente com IC e fração de ejeção de 45%. Como é classificado?',o:['IC com FE preservada','IC com FE levemente reduzida','IC com FE reduzida','IC com FE melhorada','Disfunção diastólica isolada'],a:1,c:'FE ≤ 40%: reduzida. 41–49%: levemente reduzida. ≥ 50%: preservada.',f:['Cortes de FE na IC','≤ 40 reduzida · 41–49 levemente reduzida · ≥ 50 preservada.']},
{id:'ic4',t:'cm-ic',q:'Paciente com dispneia aguda na emergência tem NT-proBNP muito baixo. Isso:',o:['Confirma IC aguda','Torna IC aguda improvável','Indica IC com FE preservada','Indica necessidade de ecocardiograma de urgência','Não tem valor diagnóstico'],a:1,c:'Peptídeos natriuréticos têm alto valor preditivo negativo: um valor baixo praticamente exclui IC como causa da dispneia.',f:['Para que serve um BNP/NT-proBNP baixo na dispneia aguda?','Exclui IC (alto valor preditivo negativo).']},
{id:'ic5',t:'cm-ic',q:'Após iniciar espironolactona em paciente com ICFEr, o que deve ser monitorado?',o:['Glicemia','Potássio e creatinina','TSH','Enzimas hepáticas','Hemograma'],a:1,c:'Antagonista mineralocorticoide pode causar hipercalemia e piora da função renal. Checar K e creatinina em poucos dias e periodicamente.',f:['O que monitorar com espironolactona na IC?','Potássio e creatinina (risco de hipercalemia).']},
// --- FA
{id:'fa1',t:'cm-fa',q:'Paciente com FA de alta resposta (FC 160), PA 70/40 mmHg e rebaixamento do nível de consciência. Conduta imediata:',o:['Amiodarona IV lenta','Metoprolol IV','Cardioversão elétrica sincronizada','Anticoagular por 3 semanas antes de reverter','Desfibrilação não sincronizada'],a:2,c:'Taquiarritmia com instabilidade (hipotensão, rebaixamento, dor torácica, congestão) = cardioversão elétrica sincronizada imediata.',f:['FA com instabilidade hemodinâmica: conduta','Cardioversão elétrica sincronizada imediata.']},
{id:'fa2',t:'cm-fa',q:'Mulher de 70 anos com FA, hipertensa e diabética, sem outras doenças. Qual o CHA₂DS₂-VASc?',o:['2','3','4','5','6'],a:2,c:'Sexo feminino 1 + idade 65–74 1 + HAS 1 + DM 1 = 4. Indica anticoagulação.',f:['Componentes do CHA₂DS₂-VASc','IC 1, HAS 1, Idade ≥ 75 2, DM 1, AVC/AIT 2, Vascular 1, Idade 65–74 1, Sexo feminino 1.']},
{id:'fa3',t:'cm-fa',q:'Paciente com FA e prótese valvar mecânica. Qual anticoagulante?',o:['Apixabana','Rivaroxabana','Dabigatrana','Varfarina','AAS isolado'],a:3,c:'Prótese mecânica e estenose mitral moderada a grave: varfarina. Os DOACs são contraindicados nesses casos.',f:['FA com prótese mecânica ou estenose mitral moderada/grave: qual anticoagulante?','Varfarina (DOAC contraindicado).']},
{id:'fa4',t:'cm-fa',q:'Qual achado de ECG define fibrilação atrial?',o:['Ondas F em dente de serra','Intervalos RR irregularmente irregulares sem onda P','PR progressivamente maior até bloqueio','QRS largo com dissociação AV','Onda delta'],a:1,c:'FA: ausência de onda P, linha de base com ondas f e RR irregularmente irregular. Dente de serra é flutter.',f:['ECG da FA','Sem onda P + RR irregularmente irregular.']},
{id:'fa5',t:'cm-fa',q:'ECG com ondas em dente de serra em DII, DIII e aVF e FC ventricular regular de 150 bpm. Diagnóstico:',o:['Taquicardia sinusal','Fibrilação atrial','Flutter atrial típico com condução 2:1','Taquicardia ventricular','TRN'],a:2,c:'Flutter típico: frequência atrial ~300 bpm com bloqueio 2:1, dando FC ventricular ~150 bpm, regular.',f:['FC regular de 150 bpm com dente de serra em parede inferior','Flutter atrial típico com condução 2:1.']},
// --- Fisiologia CV
{id:'fcv1',t:'bs-fisiocv',q:'FC de 70 bpm, volume diastólico final de 120 mL e volume sistólico final de 50 mL. O débito cardíaco é de aproximadamente:',o:['3,5 L/min','4,9 L/min','5,6 L/min','8,4 L/min','2,1 L/min'],a:1,c:'Volume sistólico = 120 − 50 = 70 mL. DC = 70 mL × 70 bpm = 4.900 mL/min ≈ 4,9 L/min. Fração de ejeção = 70/120 ≈ 58%.',f:['Como calcular débito cardíaco e fração de ejeção','DC = FC × VS (VS = VDF − VSF). FE = VS/VDF.']},
{id:'fcv2',t:'bs-fisiocv',q:'Segundo a lei de Frank-Starling, o aumento do retorno venoso leva a:',o:['Queda do volume sistólico','Aumento da força de contração até um limite','Aumento da pós-carga como efeito principal','Redução da pré-carga','Bradicardia reflexa'],a:1,c:'Maior estiramento das fibras (pré-carga) aumenta a força de contração e o volume sistólico, até um limite.',f:['Lei de Frank-Starling','↑ pré-carga (estiramento) → ↑ força de contração e volume sistólico, até um limite.']},
{id:'fcv3',t:'bs-fisiocv',q:'A primeira bulha (B1) corresponde a:',o:['Fechamento das valvas aórtica e pulmonar','Abertura das valvas mitral e tricúspide','Fechamento das valvas mitral e tricúspide','Enchimento ventricular rápido','Contração atrial'],a:2,c:'B1 = fechamento das AV (início da sístole). B2 = fechamento das semilunares. B3 = enchimento rápido. B4 = contração atrial contra ventrículo rígido.',f:['O que gera B1 e B2?','B1: fechamento mitral e tricúspide. B2: fechamento aórtica e pulmonar.']},
{id:'fcv4',t:'bs-fisiocv',q:'Durante a contração isovolumétrica:',o:['Valva aórtica aberta e pressão ventricular caindo','Todas as valvas fechadas e pressão ventricular subindo','Valva mitral aberta e volume ventricular aumentando','Ejeção rápida de sangue','Relaxamento ventricular'],a:1,c:'Entre o fechamento da mitral e a abertura da aórtica, todas as valvas estão fechadas: a pressão sobe sem mudar o volume.',f:['O que acontece na contração isovolumétrica?','Todas as valvas fechadas; pressão ventricular sobe, volume constante.']},
{id:'fcv5',t:'bs-fisiocv',q:'Uma queda súbita da PA ao levantar provoca, pelo barorreflexo:',o:['Aumento dos disparos dos barorreceptores e bradicardia','Redução dos disparos dos barorreceptores, aumento do tônus simpático e taquicardia','Vasodilatação periférica','Aumento do tônus vagal','Nenhuma resposta autonômica'],a:1,c:'Menos estiramento no seio carotídeo e no arco aórtico → menos disparos → menos vago, mais simpático → ↑ FC, contratilidade e resistência.',f:['Barorreflexo na queda da PA','↓ disparos dos barorreceptores → ↑ simpático → ↑ FC e vasoconstrição.']},
// --- Farmaco autonômico
{id:'fa-a1',t:'bs-farmaut',q:'Agricultor com miose, sialorreia, broncorreia, bradicardia e diarreia após aplicar pesticida. Antídoto inicial:',o:['Fisostigmina','Atropina','Naloxona','Flumazenil','Adrenalina'],a:1,c:'Síndrome colinérgica por organofosforado (inibidor da acetilcolinesterase): atropina até secar as secreções, mais pralidoxima quando disponível.',f:['Intoxicação por organofosforado: quadro e antídoto','Síndrome colinérgica (DUMBELS); atropina (+ pralidoxima).']},
{id:'fa-a2',t:'bs-farmaut',q:'Em qual paciente o propranolol deve ser evitado?',o:['Portador de enxaqueca','Paciente com tremor essencial','Paciente com asma','Paciente com hipertireoidismo sintomático','Paciente com varizes esofágicas'],a:2,c:'Propranolol é betabloqueador não seletivo: o bloqueio β2 pode desencadear broncoespasmo grave em asmáticos.',f:['Por que evitar propranolol na asma?','Bloqueio β2 (não seletivo) causa broncoespasmo.']},
{id:'fa-a3',t:'bs-farmaut',q:'Adulto com anafilaxia (urticária, sibilância e hipotensão). Qual a dose e a via iniciais da adrenalina?',o:['1 mg IV em bolus','0,5 mg IM na face anterolateral da coxa (solução 1 mg/mL)','0,1 mg subcutânea','5 mg inalatória','0,05 mg IV em bolus repetido'],a:1,c:'Adrenalina IM 0,01 mg/kg (máximo 0,5 mg no adulto) no vasto lateral, repetível a cada 5–15 min. IV em bolus fica para PCR.',f:['Adrenalina na anafilaxia do adulto','0,5 mg IM (1 mg/mL) na coxa, repetir a cada 5–15 min.']},
{id:'fa-a4',t:'bs-farmaut',q:'A pilocarpina, usada no glaucoma, é:',o:['Antagonista muscarínico que causa midríase','Agonista muscarínico que causa miose','Agonista β1','Antagonista α1','Inibidor da anidrase carbônica'],a:1,c:'Agonista muscarínico: contrai o esfíncter da pupila (miose) e o músculo ciliar, facilitando a drenagem do humor aquoso.',f:['Pilocarpina: classe e efeito na pupila','Agonista muscarínico → miose.']},
{id:'fa-a5',t:'bs-farmaut',q:'No preparo cirúrgico do feocromocitoma, qual a sequência correta?',o:['Betabloqueador antes do alfabloqueador','Alfabloqueador antes do betabloqueador','Somente betabloqueador','Somente diurético','IECA isolado'],a:1,c:'Betabloquear primeiro deixa o estímulo α sem oposição e pode causar crise hipertensiva. Primeiro alfa (ex.: doxazosina), depois beta.',f:['Feocromocitoma: ordem do bloqueio','Primeiro alfa, depois beta.']},
// --- Semiologia
{id:'se1',t:'bs-semio',q:'Idoso com síncope ao esforço, sopro sistólico ejetivo em foco aórtico irradiado para carótidas e pulso parvus et tardus. Diagnóstico:',o:['Insuficiência aórtica','Estenose aórtica','Estenose mitral','Insuficiência mitral','Comunicação interventricular'],a:1,c:'Estenose aórtica: sopro sistólico em diamante no foco aórtico irradiando para o pescoço, pulso fraco e tardio. Sintomas: angina, síncope e dispneia.',f:['Sopro sistólico aórtico + pulso parvus et tardus','Estenose aórtica (sintomas: angina, síncope, dispneia).']},
{id:'se2',t:'bs-semio',q:'Sopro diastólico em ruflar no foco mitral, com estalido de abertura e hiperfonese de B1. Diagnóstico:',o:['Estenose mitral','Insuficiência aórtica','Estenose aórtica','Prolapso de valva mitral','Insuficiência tricúspide'],a:0,c:'Estenose mitral: ruflar diastólico com reforço pré-sistólico, estalido de abertura e B1 hiperfonética. Associada a febre reumática.',f:['Ruflar diastólico + estalido de abertura','Estenose mitral.']},
{id:'se3',t:'bs-semio',q:'Qual bulha NÃO ocorre em paciente com fibrilação atrial?',o:['B1','B2','B3','B4','Nenhuma das anteriores'],a:3,c:'B4 depende da contração atrial efetiva contra um ventrículo rígido. Na FA não há contração atrial organizada, então não há B4.',f:['Qual bulha some na FA e por quê?','B4: depende da contração atrial.']},
{id:'se4',t:'bs-semio',q:'Qual sopro aumenta com a manobra de Valsalva?',o:['Estenose aórtica','Cardiomiopatia hipertrófica obstrutiva','Insuficiência mitral','Estenose mitral','Comunicação interventricular'],a:1,c:'Valsalva reduz o retorno venoso e o tamanho do VE, aumentando a obstrução na via de saída da CMH. A maioria dos outros sopros diminui.',f:['Sopros que aumentam com Valsalva','CMH obstrutiva (e prolapso mitral, que fica mais precoce).']},
{id:'se5',t:'bs-semio',q:'Sopro holossistólico em foco mitral com irradiação para a axila. Diagnóstico mais provável:',o:['Estenose aórtica','Insuficiência mitral','Estenose mitral','Insuficiência aórtica','Estenose pulmonar'],a:1,c:'Insuficiência mitral: sopro holossistólico em ponta irradiando para axila; pode ter B3 por sobrecarga de volume.',f:['Holossistólico em ponta irradiando para axila','Insuficiência mitral.']},
// --- SUS / APS
{id:'sus1',t:'mi-sus',q:'Qual dos itens é um princípio organizativo, e não doutrinário, do SUS?',o:['Universalidade','Integralidade','Equidade','Descentralização','Nenhuma das anteriores'],a:3,c:'Doutrinários: universalidade, integralidade e equidade. Organizativos: descentralização, regionalização, hierarquização e participação da comunidade.',f:['Princípios doutrinários × organizativos do SUS','Doutrinários: universalidade, integralidade, equidade. Organizativos: descentralização, regionalização, hierarquização, participação popular.']},
{id:'sus2',t:'mi-sus',q:'Segundo Starfield, qual é um atributo DERIVADO da Atenção Primária?',o:['Acesso de primeiro contato','Longitudinalidade','Integralidade','Coordenação do cuidado','Orientação familiar'],a:4,c:'Essenciais: primeiro contato, longitudinalidade, integralidade e coordenação. Derivados: orientação familiar, orientação comunitária e competência cultural.',f:['Atributos essenciais e derivados da APS (Starfield)','Essenciais: primeiro contato, longitudinalidade, integralidade, coordenação. Derivados: familiar, comunitária, cultural.']},
{id:'sus3',t:'mi-sus',q:'A paciente é acompanhada pela mesma equipe da USF há 10 anos, que conhece sua história e seu contexto. Qual atributo da APS isso representa?',o:['Coordenação','Longitudinalidade','Primeiro contato','Integralidade','Competência cultural'],a:1,c:'Longitudinalidade é o acompanhamento ao longo do tempo, com vínculo, pela mesma equipe, independentemente da presença de doença.',f:['O que é longitudinalidade?','Acompanhamento ao longo do tempo pela mesma equipe, com vínculo.']},
{id:'sus4',t:'mi-sus',q:'Qual lei dispõe sobre a participação da comunidade na gestão do SUS (conselhos e conferências de saúde)?',o:['Lei 8.080/1990','Lei 8.142/1990','Constituição de 1988, art. 196','Lei 10.216/2001','Lei 9.656/1998'],a:1,c:'Lei 8.142/90: participação da comunidade (conselhos e conferências) e transferências financeiras. A 8.080/90 é a Lei Orgânica da Saúde.',f:['Lei 8.080 × Lei 8.142','8.080: Lei Orgânica (organização e funcionamento). 8.142: participação popular e financiamento.']},
{id:'sus5',t:'mi-sus',q:'A gestão municipal destina mais equipes de saúde para o bairro com maior vulnerabilidade social. Qual princípio está sendo aplicado?',o:['Universalidade','Equidade','Hierarquização','Integralidade','Regionalização'],a:1,c:'Equidade é oferecer mais a quem precisa mais: tratar desigualmente os desiguais para reduzir desigualdades.',f:['Equidade no SUS','Dar mais a quem precisa mais (tratar desigualmente os desiguais).']},
// --- Prevenção
{id:'pv1',t:'mi-prev',q:'Paciente assintomático e ansioso pede check-up com vários exames. O médico explica riscos de sobrediagnóstico e solicita apenas os rastreios indicados. Esta atitude é prevenção:',o:['Primária','Secundária','Terciária','Quaternária','Primordial'],a:3,c:'Prevenção quaternária: proteger o paciente de intervenções desnecessárias e da iatrogenia (sobremedicalização).',f:['O que é prevenção quaternária?','Evitar intervenções desnecessárias e iatrogenia.']},
{id:'pv2',t:'mi-prev',q:'O rastreamento de uma doença em pessoas assintomáticas é um exemplo de prevenção:',o:['Primária','Secundária','Terciária','Quaternária','Primordial'],a:1,c:'Secundária = diagnóstico precoce na fase pré-clínica. Primária evita que a doença surja (vacina). Terciária reduz sequelas (reabilitação).',f:['Rastreamento é prevenção de qual nível?','Secundária (detecção precoce na fase pré-clínica).']},
{id:'pv3',t:'mi-prev',q:'Programa de fisioterapia para recuperar a marcha após AVC é prevenção:',o:['Primária','Secundária','Terciária','Quaternária','Primordial'],a:2,c:'Terciária: limitar incapacidades e reabilitar depois que a doença já se manifestou.',f:['Reabilitação pós-AVC é prevenção de qual nível?','Terciária.']},
{id:'pv4',t:'mi-prev',q:'Qual NÃO é critério de Wilson e Jungner para implantar um programa de rastreamento?',o:['A doença deve ser um problema de saúde importante','Deve haver uma fase latente ou pré-clínica detectável','Deve existir tratamento eficaz na fase precoce','O teste deve ser aceitável pela população','A doença deve ser rara na população'],a:4,c:'Rastrear doença rara tem baixo valor preditivo positivo e gera muitos falsos positivos. O critério é ser um problema de saúde importante.',f:['Critérios de Wilson-Jungner (essência)','Doença importante, fase pré-clínica detectável, tratamento precoce eficaz, teste aceitável, custo-benefício.']},
{id:'pv5',t:'mi-prev',q:'Um rastreamento antecipa o diagnóstico em 3 anos, mas a data da morte não muda. A sobrevida parece maior por causa do viés de:',o:['Seleção','Tempo de antecipação (lead time)','Duração (length time)','Memória','Aferição'],a:1,c:'Lead time: a sobrevida medida a partir do diagnóstico aumenta só porque o diagnóstico veio antes. Length time favorece detectar doenças de evolução lenta.',f:['Viés de tempo de antecipação (lead time)','Sobrevida parece maior porque o diagnóstico foi antecipado, sem mudar a data da morte.']},
// --- Epidemiologia
{id:'ep1',t:'mi-testes',q:'Um novo tratamento prolonga a sobrevida de uma doença crônica sem curá-la. O que acontece com incidência e prevalência?',o:['Incidência aumenta e prevalência diminui','Incidência não muda e prevalência aumenta','Ambas diminuem','Incidência diminui e prevalência não muda','Ambas aumentam'],a:1,c:'Prevalência ≈ incidência × duração. Aumentar a duração (sobrevida sem cura) aumenta a prevalência; a incidência (casos novos) não muda.',f:['Relação entre prevalência, incidência e duração','P ≈ I × D. Tratamento que prolonga sem curar ↑ prevalência.']},
{id:'ep2',t:'mi-testes',q:'O coeficiente de mortalidade infantil é calculado como:',o:['Óbitos < 1 ano / população total × 1.000','Óbitos < 1 ano / nascidos vivos × 1.000','Óbitos < 5 anos / nascidos vivos × 1.000','Óbitos < 28 dias / nascidos vivos × 1.000','Óbitos fetais / nascidos vivos × 1.000'],a:1,c:'CMI = óbitos de menores de 1 ano / nascidos vivos no mesmo local e período × 1.000. Neonatal usa óbitos < 28 dias.',f:['Fórmula do coeficiente de mortalidade infantil','Óbitos < 1 ano / nascidos vivos × 1.000.']},
{id:'ep3',t:'mi-testes',q:'Num surto, 200 pessoas adoeceram e 10 morreram pela doença. A letalidade foi de:',o:['0,5%','2%','5%','10%','20%'],a:2,c:'Letalidade = óbitos pela doença / doentes = 10/200 = 5%. Mortalidade usa a população total no denominador.',f:['Letalidade × mortalidade','Letalidade: óbitos/doentes. Mortalidade: óbitos/população.']},
{id:'ep4',t:'mi-testes',q:'Qual desenho de estudo permite calcular diretamente a incidência e o risco relativo?',o:['Caso-controle','Transversal','Coorte','Ecológico','Série de casos'],a:2,c:'Na coorte, expostos e não expostos são acompanhados no tempo, permitindo medir incidência e risco relativo.',f:['Coorte mede o quê?','Incidência e risco relativo (segue expostos e não expostos no tempo).']},
{id:'ep5',t:'mi-testes',q:'Para estudar fatores de risco de uma doença rara, o desenho mais eficiente é ___, e a medida de associação é ___.',o:['Coorte; risco relativo','Caso-controle; odds ratio','Transversal; prevalência','Ensaio clínico; NNT','Ecológico; correlação'],a:1,c:'Caso-controle parte de doentes e não doentes e olha para trás: eficiente em doenças raras, e a medida é a odds ratio.',f:['Caso-controle: quando usar e qual medida?','Doenças raras; odds ratio.']},
// --- Testes diagnósticos
{id:'td1',t:'mi-testes',q:'Um teste foi aplicado a 100 doentes (90 positivos) e 200 sadios (180 negativos). Qual o VPP?',o:['90%','82%','75%','67%','95%'],a:1,c:'VP = 90, FP = 20. VPP = 90/(90+20) ≈ 82%. Sensibilidade = 90/100 = 90% e especificidade = 180/200 = 90%.',f:['Fórmulas de S, E, VPP e VPN','S = VP/(VP+FN) · E = VN/(VN+FP) · VPP = VP/(VP+FP) · VPN = VN/(VN+FN).']},
{id:'td2',t:'mi-testes',q:'Para triagem de doença grave em que não se pode perder nenhum caso, prefere-se um teste com alta:',o:['Especificidade','Sensibilidade','Acurácia apenas','Razão de verossimilhança negativa','Prevalência'],a:1,c:'Teste muito sensível, quando negativo, exclui a doença (SnNout). Ideal para triagem. Teste específico, quando positivo, confirma (SpPin).',f:['SnNout e SpPin','Sensível + Negativo exclui (triagem). Específico + Positivo confirma.']},
{id:'td3',t:'mi-testes',q:'O mesmo teste é aplicado numa população com prevalência maior da doença. O que acontece?',o:['Sensibilidade aumenta','Especificidade diminui','VPP aumenta e VPN diminui','VPP diminui e VPN aumenta','Nada muda'],a:2,c:'Sensibilidade e especificidade são do teste. Valores preditivos dependem da prevalência: mais prevalência, maior VPP e menor VPN.',f:['Efeito da prevalência nos valores preditivos','↑ prevalência → ↑ VPP e ↓ VPN. S e E não mudam.']},
{id:'td4',t:'mi-testes',q:'Ao reduzir o ponto de corte da glicemia para diagnosticar diabetes, espera-se:',o:['Aumento da sensibilidade e queda da especificidade','Aumento das duas','Queda da sensibilidade e aumento da especificidade','Queda das duas','Nenhuma mudança'],a:0,c:'Corte mais baixo classifica mais pessoas como positivas: menos falsos negativos (↑ sensibilidade) e mais falsos positivos (↓ especificidade).',f:['Baixar o ponto de corte de um teste','↑ sensibilidade e ↓ especificidade.']},
{id:'td5',t:'mi-testes',q:'Teste com sensibilidade de 80% e especificidade de 90%. A razão de verossimilhança positiva é:',o:['0,22','0,8','2','8','9'],a:3,c:'RV+ = S/(1 − E) = 0,8/0,1 = 8. RV− = (1 − S)/E = 0,2/0,9 ≈ 0,22.',f:['Fórmulas da razão de verossimilhança','RV+ = S/(1−E) · RV− = (1−S)/E.']},
// --- Renal
{id:'rn1',t:'bs-renal',q:'Paciente com estenose bilateral de artéria renal inicia IECA e tem queda importante da TFG. Por quê?',o:['O IECA contrai a arteríola aferente','O IECA dilata a arteríola eferente, que dependia da angiotensina II para manter a pressão glomerular','O IECA aumenta a reabsorção de sódio','O IECA causa necrose tubular direta','O IECA obstrui o ureter'],a:1,c:'Com pouco fluxo na aferente, a TFG depende da constrição eferente pela angiotensina II. O IECA tira essa constrição e a pressão glomerular cai.',f:['IECA e AINE na TFG','IECA dilata a eferente; AINE contrai a aferente. Os dois derrubam a TFG em quem depende deles.']},
{id:'rn2',t:'bs-renal',q:'Qual substância tem depuração igual à TFG por ser filtrada livremente e não ser reabsorvida nem secretada?',o:['Creatinina','Ureia','Inulina','PAH','Glicose'],a:2,c:'Inulina é o padrão-ouro. A creatinina é um pouco secretada e superestima levemente a TFG. O PAH estima o fluxo plasmático renal.',f:['Padrão-ouro para medir TFG','Clearance de inulina. PAH mede fluxo plasmático renal.']},
{id:'rn3',t:'bs-renal',q:'Idoso desidratado usa ibuprofeno e evolui com lesão renal aguda. Mecanismo:',o:['Vasodilatação eferente','Inibição das prostaglandinas que dilatam a arteríola aferente','Obstrução tubular por cristais','Aumento do fluxo plasmático renal','Ativação da ECA'],a:1,c:'Na hipovolemia, prostaglandinas mantêm a aferente dilatada. O AINE as bloqueia, a aferente contrai e a TFG cai.',f:['Por que AINE causa LRA na hipovolemia?','Bloqueia prostaglandinas que dilatam a aferente.']},
{id:'rn4',t:'bs-renal',q:'O feedback tubuloglomerular é mediado pela:',o:['Cápsula de Bowman','Mácula densa, que detecta NaCl no túbulo distal','Alça de Henle descendente','Célula intercalada','Papila renal'],a:1,c:'Mais NaCl chegando à mácula densa sinaliza constrição da aferente, reduzindo a TFG. É, com o mecanismo miogênico, a base da autorregulação.',f:['Os dois mecanismos de autorregulação da TFG','Miogênico e feedback tubuloglomerular (mácula densa sente NaCl).']},
{id:'rn5',t:'bs-renal',q:'A fração de filtração (TFG / fluxo plasmático renal) em condições normais é de cerca de:',o:['5%','20%','50%','75%','90%'],a:1,c:'TFG ~125 mL/min e FPR ~625 mL/min: fração de filtração ≈ 20%. Constrição eferente aumenta a fração de filtração.',f:['Fração de filtração normal','≈ 20% (TFG/FPR).']},
// --- Sepse
{id:'sp1',t:'mi-sepse',q:'Segundo o Sepsis-3, sepse é definida como:',o:['SIRS com foco infeccioso suspeito','Disfunção orgânica ameaçadora à vida causada por resposta desregulada do hospedeiro à infecção','Hemocultura positiva com febre','Lactato acima de 4 mmol/L','Infecção com leucocitose'],a:1,c:'Sepsis-3: infecção + disfunção orgânica, operacionalizada por aumento de 2 ou mais pontos no SOFA. Os critérios de SIRS saíram da definição.',f:['Definição de sepse (Sepsis-3)','Disfunção orgânica ameaçadora à vida por resposta desregulada à infecção (↑ SOFA ≥ 2).']},
{id:'sp2',t:'mi-sepse',q:'Paciente séptico que, após reposição volêmica adequada, precisa de vasopressor para PAM ≥ 65 mmHg e tem lactato de 3 mmol/L. Classificação:',o:['Sepse sem choque','Choque séptico','SIRS','Choque cardiogênico','Bacteremia'],a:1,c:'Choque séptico: vasopressor para manter PAM ≥ 65 mmHg e lactato > 2 mmol/L apesar de volume adequado.',f:['Critérios de choque séptico','Vasopressor para PAM ≥ 65 + lactato > 2 apesar de volume.']},
{id:'sp3',t:'mi-sepse',q:'No paciente com sepse e hipotensão ou lactato ≥ 4 mmol/L, a reposição volêmica inicial sugerida é:',o:['10 mL/kg de coloide','30 mL/kg de cristaloide nas primeiras 3 horas','Albumina 20% como primeira escolha','Restrição hídrica','500 mL de soro glicosado'],a:1,c:'O pacote da 1ª hora inclui lactato, hemoculturas antes do antibiótico, antibiótico de amplo espectro, 30 mL/kg de cristaloide se hipotensão ou lactato ≥ 4, e vasopressor se PAM < 65.',f:['Itens do pacote da 1ª hora na sepse','Lactato, hemoculturas, antibiótico amplo, 30 mL/kg de cristaloide, vasopressor se PAM < 65.']},
{id:'sp4',t:'mi-sepse',q:'Vasopressor de primeira escolha no choque séptico:',o:['Dopamina','Noradrenalina','Dobutamina','Adrenalina','Vasopressina isolada'],a:1,c:'Noradrenalina é a primeira escolha. Vasopressina entra como segunda droga; dobutamina se houver disfunção miocárdica com baixo débito.',f:['Vasopressor de 1ª escolha no choque séptico','Noradrenalina.']},
{id:'sp5',t:'mi-sepse',q:'Sobre o qSOFA, segundo a Surviving Sepsis Campaign 2021:',o:['É o melhor teste isolado de triagem de sepse','Não deve ser usado isoladamente como ferramenta de triagem, comparado a SIRS, NEWS ou MEWS','Substitui o SOFA no diagnóstico','Inclui lactato','Só vale em UTI'],a:1,c:'qSOFA (FR ≥ 22, alteração mental, PAS ≤ 100) prediz mau prognóstico, mas é pouco sensível. A SSC 2021 recomenda não usá-lo sozinho como triagem.',f:['Componentes do qSOFA e seu papel','FR ≥ 22, alteração mental, PAS ≤ 100. Não usar isolado para triagem (SSC 2021).']},
// --- Próximos temas do plano
{id:'va1',t:'cm-valv',q:'Paciente usuário de drogas IV com febre, hemoculturas positivas para S. aureus em 2 amostras e vegetação tricúspide no ecocardiograma. Pelos critérios de Duke:',o:['1 critério maior','2 critérios maiores: endocardite definida','Endocardite possível','Endocardite rejeitada','Precisa de biópsia valvar'],a:1,c:'Hemoculturas típicas persistentes e evidência de envolvimento endocárdico (vegetação) são os 2 critérios maiores. Dois maiores = endocardite definida.',f:['Critérios maiores de Duke','Hemoculturas positivas típicas + evidência de envolvimento endocárdico (eco).']},
{id:'va2',t:'cm-valv',q:'Dor torácica que piora deitado e melhora sentado inclinado para frente, com supra de ST difuso e infra de PR. Diagnóstico:',o:['IAM com supra','Pericardite aguda','Dissecção de aorta','TEP','Repolarização precoce'],a:1,c:'Pericardite aguda: dor pleurítica posicional, atrito pericárdico, supra de ST difuso côncavo e infra de PR. Tratamento: AINE + colchicina.',f:['ECG da pericardite aguda','Supra de ST difuso côncavo + infra de PR.']},
{id:'va3',t:'cm-valv',q:'Hipotensão, turgência jugular e bulhas abafadas compõem:',o:['Tríade de Charcot','Tríade de Beck (tamponamento cardíaco)','Tríade de Cushing','Tríade de Virchow','Pêntade de Reynolds'],a:1,c:'Tríade de Beck = tamponamento. Pode haver pulso paradoxal. Tratamento: pericardiocentese.',f:['Tríade de Beck','Hipotensão + turgência jugular + bulhas abafadas = tamponamento.']},
{id:'as1',t:'cm-asma',q:'Segundo a GINA atual, para asma leve em adulto, qual tratamento preferencial?',o:['Salbutamol isolado quando necessário','Budesonida-formoterol quando necessário','Montelucaste isolado','Teofilina','Corticoide oral em ciclos'],a:1,c:'SABA isolado não é mais recomendado. Nos passos 1–2, a via preferida é ICS-formoterol (ex.: budesonida-formoterol) conforme necessidade.',f:['Asma leve: tratamento preferencial (GINA)','ICS-formoterol conforme necessidade. Nunca SABA isolado.']},
{id:'as2',t:'cm-asma',q:'Qual achado indica crise asmática com risco de vida?',o:['Sibilos difusos','FR de 24 irpm','Tórax silencioso','Uso de musculatura acessória leve','Tosse seca'],a:2,c:'Tórax silencioso, cianose, confusão, bradicardia e hipercapnia indicam crise ameaçadora à vida.',f:['Sinais de crise asmática ameaçadora à vida','Tórax silencioso, cianose, confusão, bradicardia, hipercapnia.']},
{id:'as3',t:'cm-asma',q:'Na espirometria, resposta significativa ao broncodilatador é:',o:['Aumento do VEF1 ≥ 12% e ≥ 200 mL','Aumento da CVF de 5%','VEF1/CVF > 0,70','Queda do VEF1 de 20%','Aumento do pico de fluxo de 5%'],a:0,c:'Variação do VEF1 ≥ 12% e ≥ 200 mL após broncodilatador sustenta o diagnóstico de asma.',f:['Prova broncodilatadora positiva','↑ VEF1 ≥ 12% e ≥ 200 mL.']},
{id:'dp1',t:'cm-dpoc',q:'O diagnóstico de DPOC exige, na espirometria:',o:['VEF1/CVF pré-broncodilatador < 0,80','VEF1/CVF pós-broncodilatador < 0,70','VEF1 < 50%','CVF < 80%','Resposta ao broncodilatador'],a:1,c:'DPOC: sintomas + exposição + VEF1/CVF pós-BD < 0,70 (obstrução persistente).',f:['Critério espirométrico de DPOC','VEF1/CVF pós-broncodilatador < 0,70.']},
{id:'dp2',t:'cm-dpoc',q:'Indicação de oxigenoterapia domiciliar prolongada na DPOC estável:',o:['SpO2 ≤ 92% em repouso','PaO2 ≤ 55 mmHg ou SpO2 ≤ 88% em repouso','Qualquer dispneia aos esforços','PaCO2 > 45 mmHg','VEF1 < 30%'],a:1,c:'PaO2 ≤ 55 mmHg ou SpO2 ≤ 88%, ou PaO2 56–59 com cor pulmonale ou policitemia. Uso ≥ 15 h/dia reduz mortalidade.',f:['Indicação de O2 domiciliar na DPOC','PaO2 ≤ 55 ou SpO2 ≤ 88% (ou 56–59 com cor pulmonale/policitemia).']},
{id:'dp3',t:'cm-dpoc',q:'Quais intervenções reduzem a mortalidade na DPOC?',o:['Corticoide inalatório isolado','Cessação do tabagismo e O2 domiciliar em hipoxêmicos','Teofilina','Mucolíticos','Antibiótico profilático contínuo'],a:1,c:'Cessar o tabagismo e a oxigenoterapia prolongada em hipoxêmicos crônicos reduzem mortalidade. Broncodilatadores melhoram sintomas e exacerbações.',f:['O que reduz mortalidade na DPOC?','Parar de fumar e O2 domiciliar (quando indicado).']},
{id:'pn1',t:'cm-pnm',q:'Homem de 40 anos, sem comorbidades, com PAC. Lúcido, FR 22, PA 120/80, ureia normal. CURB-65 e conduta:',o:['0; tratamento ambulatorial','2; internação em enfermaria','3; UTI','1; internação obrigatória','4; UTI'],a:0,c:'CURB-65 = 0: tratamento ambulatorial (ex.: amoxicilina ou macrolídeo). 2: considerar internação. ≥ 3: internação, avaliar UTI.',f:['Componentes do CURB-65','Confusão, Ureia > 50 mg/dL, FR ≥ 30, PAS < 90 ou PAD ≤ 60, idade ≥ 65.']},
{id:'pn2',t:'cm-pnm',q:'Agente etiológico mais comum da pneumonia adquirida na comunidade:',o:['Haemophilus influenzae','Streptococcus pneumoniae','Mycoplasma pneumoniae','Staphylococcus aureus','Klebsiella pneumoniae'],a:1,c:'Pneumococo é o principal agente da PAC em todas as faixas de gravidade.',f:['Principal agente da PAC','Streptococcus pneumoniae.']},
{id:'pn3',t:'cm-pnm',q:'Idosa de 80 anos, confusa, FR 32 e PA 85/50. CURB-65 mínimo e conduta:',o:['2; ambulatorial','4; internação com avaliação de UTI','1; ambulatorial','3; ambulatorial com retorno em 48 h','0; alta'],a:1,c:'Confusão 1 + FR ≥ 30 1 + PA baixa 1 + idade ≥ 65 1 = 4 (sem contar ureia). Internação e avaliação de UTI.',f:['CURB-65 ≥ 3: conduta','Internação, considerar UTI.']}
];

// Refaz a agenda com os temas novos sem perder o que já foi marcado, as notas e as revisões
function migrateSchedule() {
  const old = S.sched;
  S.sched = []; buildInitialSchedule();
  old.forEach(o => { if (o.topic === 'mi-epi') o.topic = 'mi-testes'; });
  S.reviews.forEach(r => { if (r.topic === 'mi-epi') r.topic = 'mi-testes'; });

  S.cards.forEach(c => { if (c.t === 'mi-epi') c.t = 'mi-testes'; });
  old.forEach(o => {
    const n = S.sched.find(x => x.topic === o.topic);
    if (n) { ['done', 'doneAt', 'hits', 'total'].forEach(k => { if (o[k] !== undefined) n[k] = o[k]; }); S.reviews.forEach(r => { if (r.sid === o.id) r.sid = n.id; }); }
    else if (o.done || String(o.topic).startsWith('u-')) S.sched.push(o);
  });
  S.schedV = SCHED_V; save();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

const PLAN_MAP = Object.fromEntries(SEQ.map((p, i) => [p[0], { name: p[1], area: p[2], sub: p[3], kind: p[4], ref: p[5], ord: i }]));
function topic(id) {
  if (S.topics[id]) return S.topics[id];
  if (FIRST_TOPICS[id]) { const [name, area, sub, ref] = FIRST_TOPICS[id]; return { name, area, sub, ref, kind: 't' }; }
  if (PLAN_MAP[id]) return PLAN_MAP[id];
  return { name: id, area: 'geral', sub: '', kind: 't' };
}
function allTopicIds() {
  const ids = new Set([...Object.keys(FIRST_TOPICS), ...SEQ.filter(p => p[4] === 't').map(p => p[0]), ...Object.keys(S.topics)]);
  return [...ids].filter(id => topic(id).kind === 't');
}
function cap(date) { return isWeekend(date) ? 2 : 1; }

function buildInitialSchedule() {
  FIRST_DAYS.forEach(([date, ids]) => ids.forEach((t, i) => S.sched.push({ id: uid(), date, topic: t, slot: SLOT_LABEL[i], kind: 't', done: false })));
  let date = PHASE2_START, used = 0;
  SEQ.forEach((p, i) => {
    while (used >= cap(date)) { date = addDays(date, 1); used = 0; }
    S.sched.push({ id: uid(), date, topic: p[0], kind: p[4], plan: true, ord: i, done: false });
    used++;
  });
}
function replan() {
  const start = today() > PHASE2_START ? today() : PHASE2_START;
  const usedBy = {};
  S.sched.filter(s => s.plan && s.done && s.date >= start).forEach(s => usedBy[s.date] = (usedBy[s.date] || 0) + 1);
  const pending = S.sched.filter(s => s.plan && !s.done).sort((a, b) => a.ord - b.ord);
  let date = start;
  pending.forEach(s => {
    while ((usedBy[date] || 0) >= cap(date)) date = addDays(date, 1);
    s.date = date; usedBy[date] = (usedBy[date] || 0) + 1;
  });
  save();
}

// ===== Desempenho =====
function perfByTopic() {
  const P = {};
  const add = (t, total, hits, d) => { if (!t || !total) return; const p = P[t] || (P[t] = { total: 0, hits: 0, last: '' }); p.total += +total; p.hits += +hits; if (d > p.last) p.last = d; };
  S.attempts.forEach(a => add(a.t, 1, a.r === 'ok' ? 1 : 0, a.d));
  S.sched.forEach(s => add(s.topic, s.total, s.hits, s.doneAt || s.date));
  S.reviews.forEach(r => r.done && add(r.topic, r.total, r.hits, r.doneAt || r.date));
  S.manual.forEach(m => add(m.t, m.total, m.hits, m.d));
  return P;
}
function weakTopics() {
  const P = perfByTopic();
  return Object.keys(P).filter(t => pct(P[t].hits, P[t].total) < 70);
}

const bank = () => QUESTIONS.concat(S.qimp);
function lastResult(qid) { for (let i = S.attempts.length - 1; i >= 0; i--) if (S.attempts[i].qid === qid) return S.attempts[i].r; return null; }
function pickQuestions(topics, n) {
  const set = new Set(topics);
  const pool = bank().filter(q => set.has(q.t)).map(q => {
    const r = lastResult(q.id);
    const w = r == null ? 2 : r === 'ok' ? 0.5 : 3;
    return { q, w: w * (0.5 + Math.random()) };
  }).sort((a, b) => b.w - a.w);
  // intercalar por tema (round-robin) para treinar o reconhecimento do assunto
  const byT = {};
  pool.forEach(({ q }) => (byT[q.t] = byT[q.t] || []).push(q));
  const keys = shuffle(Object.keys(byT)), out = [];
  while (out.length < n && keys.some(k => byT[k].length)) keys.forEach(k => { if (out.length < n && byT[k].length) out.push(byT[k].shift()); });
  return out;
}

function cardFromQuestion(q) {
  const ex = S.cards.find(c => c.src === q.id);
  if (ex) { ex.due = today(); ex.lapses = (ex.lapses || 0) + 1; ex.ivl = 0; return false; }
  const [f, b] = q.f || [q.q, q.o[q.a] + '. ' + (q.c || '')];
  S.cards.push({ id: uid(), f, b, t: q.t, due: today(), ivl: 0, ease: 2.5, reps: 0, lapses: 1, src: q.id, created: today() });
  return true;
}
function dueCards(d = today()) { return S.cards.filter(c => c.due <= d); }
function gradeCard(c, g) {
  if (g === 0) { c.reps = 0; c.ivl = 0; c.lapses = (c.lapses || 0) + 1; c.ease = Math.max(1.3, c.ease - 0.2); c.due = today(); return; }
  if (g === 1) { c.ivl = Math.max(1, Math.round((c.ivl || 1) * 1.2)); c.ease = Math.max(1.3, c.ease - 0.15); }
  if (g === 2) { c.ivl = c.reps === 0 ? 1 : c.reps === 1 ? 3 : Math.round(c.ivl * c.ease); }
  if (g === 3) { c.ivl = c.reps === 0 ? 3 : Math.round(Math.max(c.ivl, 2) * c.ease * 1.3); c.ease += 0.15; }
  c.reps++; c.due = addDays(today(), c.ivl);
}

function timePlanHTML(d, m, items, revs, due) {
  if (!m) return '<p class="small muted" style="margin:0">Diga quantos minutos você tem e eu divido o tempo entre flashcards, revisões e o tema novo.</p>';
  const fc = due ? Math.min(20, Math.max(5, Math.ceil(due * 0.75))) : 0;
  const pend = revs.filter(r => !r.done && r.kind !== 'D+1').length;
  let rev = Math.min(pend * 30, Math.max(0, m - fc));
  let rest = Math.max(0, m - fc - rev);
  const nTopics = items.filter(i => !i.done).length;
  const study = nTopics ? Math.round(rest * 0.75) : 0;
  const q = rest - study;
  const nq = Math.max(0, Math.floor((q + rev) / 3));
  const lines = [];
  if (fc) lines.push(`<li><b>${fc} min</b> de flashcards vencidos (${due})</li>`);
  if (rev) lines.push(`<li><b>${rev} min</b> de revisões espaçadas (${pend} × 10 questões)</li>`);
  if (study) lines.push(`<li><b>${study} min</b> de estudo do${nTopics > 1 ? 's' : ''} tema${nTopics > 1 ? 's' : ''} novo${nTopics > 1 ? 's' : ''} (${nTopics > 1 ? `~${Math.round(study / nTopics)} min cada` : 'pré-teste → erros → recuperação ativa'})</li>`);
  if (q) lines.push(`<li><b>${q} min</b> de questões de pós-teste</li>`);
  const warn = m < 45 ? '<p class="small" style="margin:6px 0 0;color:var(--warn)">Tempo curto: faça os flashcards e as revisões vencidas primeiro, e deixe o tema novo para amanhã.</p>' : '';
  return `<ul style="margin:0;padding-left:20px">${lines.join('')}</ul><p class="small muted" style="margin:6px 0 0">Mini-simulado sugerido: <b>${nq} questões</b> (~3 min cada com a correção).</p>${warn}`;
}

function barHTML(label, p, sub, area) {
  const [, cls] = statusOf(p);
  const st = AREA_STYLE[area];
  const color = st ? st[1] : (cls === 'ok' ? 'var(--ok)' : cls === 'warn' ? 'var(--warn)' : cls === 'bad' ? 'var(--bad)' : 'var(--accent)');
  return `<div class="bar">${st ? `<span class="dot t-${st[0]}">${ic(st[2])}</span>` : '<span></span>'}<span class="name">${esc(label)}${sub ? ` <small>· ${sub}</small>` : ''}</span><span class="v" style="color:${p == null ? 'var(--muted)' : 'inherit'}">${p == null ? '—' : p + '%'}</span><div class="track"><div class="fill" style="width:${p ?? 0}%;background:${color}"></div></div></div>`;
}
function dayTotals() {
  const daily = {};
  const add = (d, n, h) => { if (!d || !n) return; const x = daily[d] || (daily[d] = [0, 0]); x[0] += +n; x[1] += +(h || 0); };
  S.attempts.forEach(a => add(a.d, 1, a.r === 'ok' ? 1 : 0));
  S.reviews.forEach(r => r.done && add(r.doneAt, r.total, r.hits));
  S.sched.forEach(s => s.total && add(s.doneAt || s.date, s.total, s.hits));
  S.manual.forEach(m => add(m.d, m.total, m.hits));
  return daily;
}
function weekHTML() {
  const daily = dayTotals();
  const days = []; for (let i = 6; i >= 0; i--) days.push(addDays(today(), -i));
  const W = 560, H = 200, B = 34, T = 26, slot = W / 7, bw = Math.min(46, slot * .55), y = v => T + (H - T - B) * (1 - v / 100);
  const bars = days.map((d, i) => {
    const x = i * slot + (slot - bw) / 2, v = daily[d] ? pct(daily[d][1], daily[d][0]) : null;
    const top = v == null ? H - B - 6 : y(v);
    return `<rect x="${x}" y="${top}" width="${bw}" height="${H - B - top}" rx="10" fill="${v == null ? 'var(--surface2)' : 'var(--bar-lilac)'}"/>
      ${v != null ? `<text x="${x + bw / 2}" y="${top - 7}" text-anchor="middle" font-size="12" font-weight="800" fill="var(--ink)">${v}%</text>` : ''}
      <text x="${x + bw / 2}" y="${H - 12}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--muted)">${WD[pd(d).getDay()]}</text>`;
  }).join('');
  return `<div class="tablewrap"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Acerto por dia na última semana">
    <line x1="0" x2="${W}" y1="${y(80)}" y2="${y(80)}" stroke="var(--bar-lilac)" stroke-dasharray="5 5"/>
    <text x="${W}" y="${y(80) - 6}" text-anchor="end" font-size="11" font-weight="800" fill="var(--lilac-ink)">meta 80%</text>${bars}</svg></div>`;
}

// ===== Eventos =====
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'INPUT' && b.type !== 'checkbox' || b.tagName === 'SELECT' || b.tagName === 'TEXTAREA') return;
  const a = b.dataset.act, id = b.dataset.id;
  if (a === 'toggle') { const s = S.sched.find(x => x.id === id); markStudied(s, b.checked); save(); toast(b.checked ? (s.kind === 't' ? 'Estudado. Revisões D+1, D+7, D+30 e D+90 agendadas.' : 'Concluído.') : 'Desmarcado.'); return rerender(); }
  if (a === 'rev') { const r = S.reviews.find(x => x.id === id); r.done = b.checked; r.doneAt = b.checked ? today() : null; save(); toast(b.checked ? 'Revisão registrada.' : 'Desmarcada.'); return rerender(); }
  if (a === 'rename') { const s = S.sched.find(x => x.id === id); const el = b.closest('.item').querySelector('.t'); const tp = topic(s.topic);
    el.innerHTML = `<form class="row" data-form="rename" data-id="${id}"><input id="rn-${id}" value="${esc(tp.name)}" style="flex:1;min-width:180px" aria-label="Novo assunto"><select id="ra-${id}" aria-label="Área">${Object.entries(AREAS).map(([k, v]) => `<option value="${k}" ${k === tp.area ? 'selected' : ''}>${v}</option>`).join('')}</select><button class="primary">Salvar</button></form>`;
    $(`#rn-${id}`).focus(); return; }
  if (a === 'search') { searchTerm = topic(b.dataset.t).name.split(':')[0]; location.hash = '#provas'; return; }
  if (a === 'day') { viewDate = b.dataset.n === '0' ? today() : addDays(viewDate, +b.dataset.n); return rHoje(); }
  if (a === 'minisim') {
    const d = today();
    const revT = S.reviews.filter(r => !r.done && r.date <= d && r.kind !== 'D+1').map(r => r.topic);
    let ts = [...new Set([...revT, ...weakTopics(), ...S.sched.filter(s => s.date === d).map(s => s.topic)])];
    if (!ts.length) ts = studiedTopics();
    const m = +S.time[d] || 30; const n = Math.max(5, Math.min(30, Math.floor(m * 0.4 / 3)));
    return startSim(ts, n, true, 'Mini-simulado do dia');
  }
  if (a === 'quicksim') return startSim([b.dataset.t], 10, true, 'Revisão: ' + topic(b.dataset.t).name);
  if (a === 'agendaAll') { agendaAll = !agendaAll; return rAgenda(); }
  if (a === 'replan') { replan(); toast('Temas pendentes redistribuídos a partir de hoje.'); return rAgenda(); }
  if (a === 'simPick') return simAnswer(+b.dataset.i);
  if (a === 'simNS') return simAnswer(null);
  if (a === 'simNext') { SIM.i++; return renderSimRun(); }
  if (a === 'simQuit') { SIM.qs = SIM.qs.slice(0, SIM.res.filter(Boolean).length); SIM.i = SIM.qs.length; return renderSimRun(); }
  if (a === 'simNew') { SIM = null; return rSim(); }
  if (a === 'fcStart') { FCQ = shuffle(dueCards().map(c => c.id)); fcShow = false; return rFc(); }
  if (a === 'fcAll') { FCQ = shuffle(S.cards.map(c => c.id)); fcShow = false; return rFc(); }
  if (a === 'fcStop') { FCQ = null; return rFc(); }
  if (a === 'fcFlip') { fcShow = true; return rFc(); }
  if (a === 'fcGrade') { const c = S.cards.find(x => x.id === FCQ[0]); const g = +b.dataset.g; gradeCard(c, g); FCQ.shift(); if (g === 0) FCQ.push(c.id); fcShow = false; save(); if (!FCQ.length) { FCQ = null; toast('Revisão de flashcards concluída.'); } return rFc(); }
  if (a === 'fcDel') { S.cards = S.cards.filter(c => c.id !== id); save(); return rFc(); }
  if (a === 'mnDel') { S.mnemos = S.mnemos.filter(m => m.id !== id); save(); return rMn(); }
  if (a === 'tut') { $('#tutOut').value = tutorPrompt(b.dataset.k, $('#tutT').value); return; }
  if (a === 'copy') { const el = $('#' + b.dataset.src); const txt = el.value; if (!txt) return toast('Nada para copiar ainda.');
    const done = () => { toast('Copiado.'); if (b.dataset.bk) { S.lastBackup = today(); save(); } };
    navigator.clipboard?.writeText(txt).then(done).catch(() => { el.focus(); el.select(); toast('Texto selecionado. Use Copiar do sistema.'); }) ?? (el.select(), toast('Texto selecionado. Use Copiar do sistema.')); return; }
  if (a === 'impQ') return importQuestions();
  if (a === 'clearQ') { S.qimp = []; save(); toast('Questões importadas apagadas.'); return rProvas(); }
  if (a === 'download') { try { const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }); const u = URL.createObjectURL(blob); const l = document.createElement('a'); l.href = u; l.download = `backup-caderno-maria-${today()}.json`; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); S.lastBackup = today(); save(); toast('Backup gerado. Se nada baixou, use Copiar backup.'); } catch (err) { toast('Não deu para baixar aqui. Use Copiar backup.'); } return; }
  if (a === 'restore') return doRestore();
  if (a === 'restoreCancel') { restoreArmed = false; return rBackup(); }
  if (a === 'reset') { if (!resetArmed) { resetArmed = true; return rBackup(); } S = blank(); buildInitialSchedule(); S.schedV = SCHED_V; save(); resetArmed = false; toast('Progresso apagado.'); return rBackup(); }
  if (a === 'resetCancel') { resetArmed = false; return rBackup(); }
});
document.addEventListener('change', e => {
  const el = e.target, a = el.dataset.act;
  if (a === 'score' || a === 'rscore') {
    const arr = a === 'score' ? S.sched : S.reviews; const o = arr.find(x => x.id === el.dataset.id);
    o[el.dataset.f] = el.value === '' ? undefined : +el.value;
    if (a === 'rscore' && o.hits != null && !o.done) { o.done = true; o.doneAt = today(); o.total = o.total ?? 10; }
    save(); return rerender();
  }
  if (a === 'mins') { S.time[viewDate] = el.value === '' ? undefined : +el.value; save(); return rHoje(); }
  if (a === 'fcFilter') { fcFilter = el.value; return rFc(); }
  if (a === 'mnMode') { mnMode = el.value; return rMn(); }
  if (el.name === 'mode') { if (el.value === 'escolher') $('#simTopics').scrollIntoView({ block: 'nearest' }); }
});
document.addEventListener('input', e => { if (e.target.dataset.act === 'note') { S.notes[viewDate] = e.target.value; save(); } });
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target.dataset.form;
  if (f === 'rename') { const id = e.target.dataset.id; const s = S.sched.find(x => x.id === id); const name = $(`#rn-${id}`).value.trim(); if (!name) return;
    const old = topic(s.topic); const nid = 'u-' + uid(); S.topics[nid] = { name, area: $(`#ra-${id}`).value, sub: name === old.name ? old.sub : '', kind: s.kind };
    S.reviews.filter(r => r.sid === id).forEach(r => r.topic = nid); s.topic = nid; save(); toast('Assunto atualizado.'); return rerender(); }
  if (f === 'addItem') { const nid = 'u-' + uid(); S.topics[nid] = { name: $('#addName').value.trim(), area: $('#addArea').value, sub: '', kind: 't' };
    S.sched.push({ id: uid(), date: $('#addDate').value, topic: nid, kind: 't', slot: 'Extra', done: false }); save(); toast('Assunto adicionado.'); return rAgenda(); }
  if (f === 'simStart') {
    const mode = e.target.querySelector('input[name="mode"]:checked').value;
    let ts = mode === 'estudados' ? studiedTopics() : mode === 'fracos' ? weakTopics() : mode === 'todos' ? [...new Set(bank().map(q => q.t))] : [...document.querySelectorAll('#simTopics input:checked')].map(i => i.value);
    if (!ts.length) return toast(mode === 'estudados' ? 'Marque temas como estudados na agenda, ou escolha os temas.' : mode === 'fracos' ? 'Ainda não há pontos fracos registrados.' : 'Escolha pelo menos um tema.');
    return startSim(ts, +$('#simN').value, $('#simClock').checked, { estudados: 'Temas que já estudei', fracos: 'Pontos fracos', todos: 'Misturado', escolher: 'Temas escolhidos' }[mode]);
  }
  if (f === 'addCard') { S.cards.push({ id: uid(), f: $('#cardF').value.trim(), b: $('#cardB').value.trim(), t: $('#cardT').value, due: today(), ivl: 0, ease: 2.5, reps: 0, lapses: 0, created: today() }); save(); toast('Cartão criado.'); return rFc(); }
  if (f === 'manual') { S.manual.push({ t: $('#manT').value, d: $('#manD').value || today(), total: +$('#manN').value, hits: Math.min(+$('#manH').value, +$('#manN').value) }); save(); toast('Registrado.'); return rPerf(); }
  if (f === 'addMn') { S.mnemos.push({ id: uid(), t: $('#mnT').value, title: $('#mnTitle').value.trim(), m: $('#mnText').value.trim(), mine: true }); save(); toast('Mnemônico salvo.'); return rMn(); }
  if (f === 'search') { searchTerm = $('#srch').value.trim(); $('#srchLinks').innerHTML = searchLinks(searchTerm); }
});
function importQuestions() {
  let arr;
  try { const raw = $('#impQ').value.trim(); arr = JSON.parse(raw.slice(raw.indexOf('['), raw.lastIndexOf(']') + 1)); } catch (e) { return toast('Não consegui ler. Confira se é uma lista JSON começando com [ e terminando com ].'); }
  let ok = 0;
  arr.forEach(q => { if (q && q.q && Array.isArray(q.o) && Number.isInteger(+q.a) && +q.a < q.o.length) { S.qimp.push({ id: 'imp-' + uid(), t: q.t && topic(q.t).name !== q.t ? q.t : (q.t || 'geral'), q: q.q, o: q.o, a: +q.a, c: q.c || '', f: q.f, fonte: q.fonte || '' }); ok++; } });
  save(); toast(`${ok} questão(ões) importada(s).`); rProvas();
}
async function doRestore() {
  if (!restoreArmed) { restoreArmed = true; return rBackup(); }
  let txt = $('#bkIn').value.trim();
  const file = $('#bkFile').files[0];
  if (file) txt = await file.text();
  try { const o = JSON.parse(txt); if (!o || !Array.isArray(o.sched)) throw 0; S = Object.assign(blank(), o); if (S.schedV !== SCHED_V) migrateSchedule(); save(); restoreArmed = false; toast('Backup restaurado.'); rBackup(); }
  catch (e) { restoreArmed = false; toast('Esse texto não parece um backup do caderno.'); rBackup(); }
}

load();
document.querySelectorAll('#tabs a').forEach(a => a.insertAdjacentHTML('afterbegin', ic(a.dataset.ic)));
$('#logoMark').innerHTML = ic('heart');
$('#todayPill').innerHTML = ic('calendar') + ' ' + fmtLong(today());
window.addEventListener('hashchange', route);
route();
