<style>
/* Layout: an open ring binder on a pink cover — two pages + gold mechanism on wide screens, one page + side tabs on phone */
:root{
  --cover:#EEA9B8; --cover-2:#F6BFCB; --cover-3:#E59CAD;
  --paper:#FFFBF9; --paper-edge:#F4ECE8;
  --wine:#9E182B; --rose:#F9CBD6; --blush:#F2AFBC; --oat:#F2E0D2;
  --ink:#2B2222; --muted:#8C7376; --line:#E9D8D4; --grid:#C9B6B2; --done:#B9A3A3; --on-wine:#FFF3EF;
  --f-script:'Pinyon Script','Snell Roundhand','Apple Chancery',cursive;
  --f-serif:'Playfair Display','Didot','Georgia',serif;
  --f-sans:'Instrument Sans',-apple-system,'Helvetica Neue',Arial,sans-serif;
  --f-hand:'Nothing You Could Do','Bradley Hand','Segoe Print',cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--cover);color:var(--ink);font-family:var(--f-sans);font-size:14px;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
.desk{min-height:100%;padding:14px 16px 28px;background:radial-gradient(80% 60% at 25% 10%,var(--cover-2) 0,transparent 70%),radial-gradient(70% 60% at 85% 95%,var(--cover-3) 0,transparent 70%),var(--cover)}
body.leve .desk{background:linear-gradient(160deg,#F4EDE8 0%,#EFE4EA 50%,#E8E2EF 100%)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1360px;margin:0 auto 12px;padding-right:44px;flex-wrap:wrap}
.logo{font-family:var(--f-script);font-size:46px;color:var(--wine);line-height:1}
.cap{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#7A4A52}
.datenav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.iconbtn{width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,251,249,.65);color:var(--wine);font-size:16px;display:inline-flex;align-items:center;justify-content:center}
.pill{display:inline-flex;align-items:center;height:30px;padding:0 14px;border-radius:15px;font-size:13px;font-weight:500;border:0;box-shadow:inset 0 0 0 1.2px var(--wine);color:var(--wine);background:rgba(255,251,249,.6);text-decoration:none;white-space:nowrap}
.pill.on{background:var(--wine);color:var(--on-wine);box-shadow:none}
.pill.sm{height:24px;font-size:11.5px;padding:0 10px}
.binder{position:relative;max-width:1360px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 56px minmax(0,1fr);padding-right:44px}
.pg{background:var(--paper);min-height:760px;padding:34px 40px 30px;display:flex;flex-direction:column;gap:18px;position:relative;min-width:0;box-shadow:0 18px 36px rgba(110,20,40,.22),0 2px 4px rgba(110,20,40,.08)}
.pg.l{border-radius:10px 0 0 10px;background:linear-gradient(90deg,var(--paper) 88%,var(--paper-edge));padding-right:46px}
.pg.r{border-radius:0 10px 10px 0;background:linear-gradient(270deg,var(--paper) 88%,var(--paper-edge));padding-left:46px}
.spine{background:linear-gradient(90deg,var(--paper-edge),#EADFDA 50%,var(--paper-edge));position:relative;box-shadow:0 18px 36px rgba(110,20,40,.22)}
.mech{position:absolute;left:50%;top:10px;bottom:10px;width:112px;transform:translateX(-50%);background:url(img/binder-gold.webp) center/100% 100% no-repeat;z-index:3;filter:drop-shadow(2px 6px 6px rgba(80,20,10,.25));pointer-events:none}
.tabs{position:absolute;right:0;top:40px;display:flex;flex-direction:column;gap:8px;z-index:4}
body.leve .tabs{opacity:.35}
body.leve .stk{display:none}
.tab{width:44px;height:92px;border-radius:0 12px 12px 0;writing-mode:vertical-rl;font-family:var(--f-serif);font-style:italic;font-size:15px;border:0;display:flex;align-items:center;justify-content:center;box-shadow:2px 3px 6px rgba(110,20,40,.15);padding:0}
.tab.on{width:50px;font-weight:600}
.t-hoje{background:var(--paper);color:var(--wine)} .t-corpo{background:var(--wine);color:var(--on-wine)} .t-estudos{background:var(--oat);color:var(--ink)}
.t-eu{background:var(--rose);color:var(--ink)} .t-planner{background:var(--blush);color:var(--ink)} .t-consumir{background:var(--ink);color:var(--rose)} .t-jardim{background:#EADCF2;color:var(--ink)}
.explorer{display:flex;flex-direction:column;gap:2px;max-height:300px;overflow:auto;padding-right:4px}
.fold summary{list-style:none;cursor:pointer;padding:6px 0 4px}.fold summary::-webkit-details-marker{display:none}
.fnote{display:block;width:100%;text-align:left;border:0;background:transparent;padding:5px 8px;border-radius:5px;font-family:var(--f-hand);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fnote:hover{background:#F6ECEA}.fnote.on{background:var(--rose)}.fnote.ghost{color:var(--done);font-style:italic}
.graphbox{background:var(--paper);background-image:radial-gradient(rgba(43,34,34,.10) 1px,transparent 1.2px);background-size:14px 14px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--line);margin-top:6px}
.mdedit{width:100%;min-height:300px;border:0;background:#fff;box-shadow:inset 0 0 0 1px var(--line);border-radius:6px;padding:14px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:13.5px;line-height:1.6;resize:vertical}
.mdview{font-family:var(--f-serif);font-size:16px;line-height:1.6;min-height:200px}
.mdview p{margin:0 0 6px}.mdview h3,.mdview h4,.mdview h5{font-weight:500;margin:10px 0 4px}.mdview h3{font-size:22px}.mdview ul{margin:4px 0 8px;padding-left:20px}
.mdview code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:#F6ECEA;padding:1px 4px;border-radius:3px}
.wl{border:0;background:none;padding:0;color:var(--wine);font:inherit;text-decoration:underline;text-decoration-color:var(--blush);text-underline-offset:3px}.wl.ghost{color:var(--done);text-decoration-style:dashed}
.tg{color:#7A5A9A;font-family:var(--f-sans);font-size:13px}
.lb{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.serif{font-family:var(--f-serif)} .it{font-style:italic}
.script{font-family:var(--f-script);color:var(--wine);font-weight:400;line-height:1}
.hw{font-family:var(--f-hand);font-weight:400}
.h2{font-family:var(--f-serif);font-style:italic;font-size:20px;margin:0;font-weight:400}
.big{font-family:var(--f-serif);font-weight:500;line-height:.95;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{position:relative;border-radius:8px;padding:16px 18px}
.c-oat{background:var(--oat)} .c-rose{background:var(--rose)} .c-white{background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.c-wine{background:var(--wine);color:var(--on-wine)} .c-wine .lb{color:var(--rose)}
.c-dash{border:1.5px dashed var(--grid)}
.btn{border:0;height:34px;padding:0 16px;border-radius:17px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.b-wine{background:var(--wine);color:var(--on-wine)} .b-line{background:transparent;color:var(--wine);box-shadow:inset 0 0 0 1.2px var(--wine)}
.b-rose{background:var(--rose);color:var(--wine)}
.stk{position:absolute;pointer-events:none;z-index:2;filter:drop-shadow(1px 3px 3px rgba(80,10,20,.22))}
.ransom{display:inline-flex;align-items:center;flex-wrap:wrap;max-width:100%}
.ransom img{height:60px;margin-right:-3px;filter:drop-shadow(1px 2px 2px rgba(80,10,20,.25))}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.item .txt{font-family:var(--f-hand);font-size:16.5px;line-height:1.25;min-width:0;overflow-wrap:anywhere}
.item.done .txt{color:var(--done);text-decoration:line-through;text-decoration-color:var(--wine)}
.chk{width:20px;height:20px;border-radius:50%;border:0;box-shadow:inset 0 0 0 1.3px var(--wine);background:transparent;padding:0;color:var(--on-wine);font-size:12px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.chk.on{background:var(--wine)}
.x{border:0;background:transparent;color:var(--done);font-size:15px;width:26px;height:26px;border-radius:50%;opacity:0;transition:opacity .15s;flex:none}
.item:hover .x,.item:focus-within .x,.hov:hover .x{opacity:1}
@media (hover:none){.x{opacity:.55}}
.log{grid-template-columns:44px 18px minmax(0,1fr) auto auto}
.tm{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.log .sym{font-family:var(--f-hand);font-size:19px;color:var(--wine);line-height:1;background:none;border:0;padding:0;width:18px}
.tag{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.nowline{display:flex;align-items:center;gap:8px;margin:2px 0}
.nowline span:first-child{font-size:10.5px;font-weight:600;color:var(--wine);width:44px}
.nowline i{flex:1;height:1.5px;background:var(--wine)} .nowline b{width:7px;height:7px;border-radius:50%;background:var(--wine)}
.add{display:flex;gap:8px;align-items:center;padding-top:8px}
.in,.add input:not([type=checkbox]){flex:1;min-width:0;border:0;border-bottom:1px dashed var(--grid);background:transparent;padding:6px 2px;font-family:var(--f-hand);font-size:16px}
.add input[type=time],.add input[type=date],.add input[type=number]{flex:0 0 auto;font-family:var(--f-sans);font-size:12px;width:auto}
.add select{border:0;background:transparent;color:var(--wine);font-size:12px}
.add .btn{flex:none}
input::placeholder,textarea::placeholder{color:#BFA9A9}
.empty{font-family:var(--f-hand);font-size:15px;color:var(--muted);padding:8px 0;margin:0}
.prog{height:3px;background:#E5CFC0;border-radius:2px} .prog i{display:block;height:100%;background:var(--wine);border-radius:2px}
.faces{display:flex;gap:6px;flex-wrap:wrap}
.face{width:40px;height:40px;border-radius:50%;border:0;background:#fff;box-shadow:inset 0 0 0 1.2px var(--grid);display:inline-flex;align-items:center;justify-content:center;padding:0}
.face.on{background:var(--rose);box-shadow:inset 0 0 0 2px var(--wine)}
.sheet{position:relative;background:#fff;border-radius:4px;box-shadow:inset 0 0 0 1px var(--line),0 2px 0 var(--line);padding:22px 22px 18px 54px;background-image:linear-gradient(transparent 27px,#F0DDE1 28px);background-size:100% 28px;background-position:0 50px;overflow:hidden}
.sheet::before{content:"";position:absolute;left:40px;top:0;bottom:0;width:1.5px;background:var(--blush)}
.sheet textarea{width:100%;border:0;background:transparent;resize:none;font-family:var(--f-hand);font-size:16.5px;line-height:28px;padding:0;min-height:168px;display:block;position:relative;z-index:1}
.qline{border-top:2px dashed var(--grid);margin:10px 0 6px;padding-top:8px;position:relative;z-index:1}
.hl{background:linear-gradient(transparent 52%,var(--rose) 52%)}
.decos{position:absolute;inset:0;z-index:2;pointer-events:none}
.deco{position:absolute;width:var(--w);transform:translate(-50%,-50%) rotate(var(--r));filter:drop-shadow(1px 3px 3px rgba(80,10,20,.22));touch-action:none;user-select:none;-webkit-user-drag:none}
.sheet.decorating .decos{pointer-events:auto}
.sheet.decorating .deco{cursor:grab}
.deco.sel{outline:1.5px dashed var(--wine);outline-offset:4px}
.tray{display:flex;gap:10px;overflow-x:auto;padding:8px 2px;-webkit-overflow-scrolling:touch}
.tray button{flex:none;width:58px;height:58px;border:0;border-radius:10px;background:rgba(255,251,249,.12);padding:4px;display:flex;align-items:center;justify-content:center}
.tray img{max-width:100%;max-height:100%}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--grid);border-left:1px solid var(--grid)}
.cal>*{border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);min-width:0}
.cal .hd{text-align:center;padding:6px 0;font-size:9.5px;letter-spacing:.2em}
.cal .cell{min-height:78px;padding:4px 5px;text-align:left;background:transparent;border-top:0;border-left:0;display:flex;flex-direction:column;gap:3px;font-size:11px}
.cal .cell.band{background:#FCE6EB} .cal .cell.today{background:var(--rose)} .cal .cell.today .n{color:var(--wine);font-weight:600}
.cal .cell.sel{box-shadow:inset 0 0 0 2px var(--wine)}
.cal .note{font-family:var(--f-hand);font-size:12px;line-height:1.1;color:var(--wine);overflow-wrap:anywhere}
.lines input{width:100%;border:0;border-bottom:1px solid var(--grid);background:transparent;height:30px;font-family:var(--f-hand);font-size:14.5px}
.dial{width:100%;height:auto;display:block}
.dial path.seg{cursor:pointer}
.week .day{display:flex;flex-direction:column}
.dh{display:flex;align-items:baseline;gap:10px;border-bottom:1.5px solid var(--wine);padding-bottom:3px}
.dh b{font-family:var(--f-serif);font-weight:400;font-size:20px}
.dh.today b{color:var(--wine)}
.seg-ctl{display:inline-flex;gap:4px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--wine);color:var(--on-wine);padding:10px 16px;border-radius:18px;font-size:13px;z-index:40;box-shadow:0 6px 18px rgba(110,20,40,.3)}
.sheet-panel{position:fixed;inset:0;background:rgba(43,34,34,.35);z-index:30;display:flex;align-items:flex-end;justify-content:center;padding:16px}
.sheet-panel .box{background:var(--paper);border-radius:14px;max-width:620px;width:100%;max-height:88%;overflow:auto;padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.track{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.track .d{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.track .sq{width:100%;max-width:56px;height:44px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--f-hand);font-size:22px;background:#fff;box-shadow:inset 0 0 0 1.2px var(--grid)}
.track .sq.ok{color:var(--wine);box-shadow:inset 0 0 0 1.5px var(--wine)}
.track .sq.now{box-shadow:inset 0 0 0 2.5px var(--wine);color:var(--wine)}
.track .sq.rest{background:repeating-linear-gradient(135deg,#F4ECE8 0 6px,#EBDFD9 6px 12px);box-shadow:none}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td,.tbl th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:baseline}
.tbl th{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500}
.tbl .num{font-variant-numeric:tabular-nums;text-align:right}
.scroll-x{overflow-x:auto}
.dots{display:inline-flex;gap:4px}
.dots button{width:14px;height:14px;border-radius:50%;border:0;padding:0;box-shadow:inset 0 0 0 1.2px var(--grid);background:transparent}
.dots button.on{background:var(--ink);box-shadow:none}
.strip{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px}
.strip button{border:0;border-radius:5px;padding:6px 5px;min-height:74px;display:flex;flex-direction:column;gap:2px;text-align:left;background:#fff;box-shadow:inset 0 0 0 1.2px var(--grid);min-width:0}
.strip .today{background:var(--wine);color:var(--on-wine);box-shadow:none}
.strip .done{background:var(--rose);box-shadow:none}
.strip .t{font-family:var(--f-hand);font-size:11.5px;line-height:1.1;overflow-wrap:anywhere}
.flash{font-family:var(--f-serif);font-size:18px;line-height:1.35;min-height:70px}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 14px;border-radius:4px 14px 14px 14px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);line-height:1.5;white-space:pre-wrap;font-size:14px}
.msg.me{align-self:flex-end;background:var(--rose);border-radius:14px 4px 14px 14px;font-family:var(--f-hand);font-size:16px}
.vb{columns:3 140px;column-gap:12px}
.vb figure{margin:0 0 12px;break-inside:avoid;position:relative;background:#fff;padding:6px 6px 18px;box-shadow:1px 3px 7px rgba(80,10,20,.2)}
.vb img{display:block;width:100%;height:auto}
.vb figure:nth-child(3n+1){transform:rotate(-2deg)} .vb figure:nth-child(3n+2){transform:rotate(1.5deg)} .vb figure:nth-child(3n){transform:rotate(-.8deg)}
.vb .x{position:absolute;right:2px;top:2px;background:var(--paper);opacity:1}
.colgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 10px}
.coltab{position:relative;text-align:left;border:0;border-radius:0 6px 6px 6px;padding:10px 10px 8px;margin-top:14px;display:flex;flex-direction:column;gap:2px;box-shadow:inset 0 0 0 1.2px var(--ink);min-width:0}
.coltab .n{position:absolute;left:0;top:-16px;height:16px;padding:0 8px;font-size:10px;line-height:16px;border-radius:4px 4px 0 0;box-shadow:inset 1.2px 1.2px 0 var(--ink),inset -1.2px 0 0 var(--ink);background:inherit}
.board{border-radius:8px;box-shadow:inset 0 0 0 1.2px var(--ink);background:var(--paper);background-image:radial-gradient(rgba(43,34,34,.12) 1px,transparent 1.2px);background-size:12px 12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.board textarea{border:0;background:rgba(255,255,255,.75);border-radius:4px;font-family:var(--f-hand);font-size:14px;min-height:70px;resize:vertical;padding:6px}

  .pg{min-height:0;padding:26px 22px}

  .two{grid-template-columns:minmax(0,1fr)}
  .cal .cell{min-height:56px}
  .cal .note{font-size:10.5px}

</style>

<div class="desk">
  <header class="topbar">
    <div class="row" style="gap:16px;flex-wrap:wrap">
      <span class="logo">Fichário</span>
      <span id="subnav" class="seg-ctl"></span>
    </div>
    <div class="datenav">
      <button class="iconbtn" id="prev" aria-label="anterior">‹</button>
      <span class="cap" id="datecap"></span>
      <button class="iconbtn" id="next" aria-label="próximo">›</button>
      <button class="pill" id="gotoday">hoje</button>
      <button class="pill" id="leveBtn">dia leve</button>
      <button class="pill" id="routineBtn">rotina</button>
      <button class="pill" id="dataBtn">dados</button>

  <main class="binder" id="binder">

(function(){

/* ================= store: db capability, falling back to this browser ================= */
let db=null, sample=null;  /* sem banco na nuvem e sem IA: tudo fica neste aparelho */
const downloads=localDownloads(), assets=localAssets();
const cache={}, subs={}, timers={};
const LS="fichario:";
function lsGet(p){try{const v=localStorage.getItem(LS+p);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(p,v){try{localStorage.setItem(LS+p,JSON.stringify(v))}catch(e){}}
function watch(path){
  if(subs[path])return;
  if(!db){if(cache[path]===undefined)cache[path]=lsGet(path);subs[path]=()=>{};return}
  subs[path]=db.doc(path).onSnapshot(s=>{
    if(s.metadata.hasPendingWrites&&cache[path])return;
    if(timers[path])return;
    cache[path]=s.exists?clone(s.data()):null;scheduleRender();
  },()=>{delete subs[path]});
}
function save(path,body,now){
  cache[path]=body;
  clearTimeout(timers[path]);
  const go=()=>{delete timers[path];
    if(db){db.doc(path).set(body).catch(e=>{toast(e&&e.code==="quota_exceeded"?"Espaço cheio: apague registros antigos.":"Não salvou agora. Tente de novo.")})} else lsSet(path,body)};
  if(now)go(); else timers[path]=setTimeout(go,700);
}
function get(p){const d=defFor(p);let c=cache[p];if(!c){c=clone(d);return c}for(const k in d)if(c[k]===undefined)c[k]=clone(d[k]);return c}
function mut(p,fn,later){const b=get(p);fn(b);save(p,b,!later);if(!later)render()}
function at(obj,key){let cur=obj;for(const s of key.split(".")){if(cur==null)return null;cur=Array.isArray(cur)?(/^\d+$/.test(s)&&!cur.some(x=>x&&x.id===s)?cur[+s]:cur.find(x=>x&&x.id===s)):cur[s]}return cur}
function setPath(obj,key,val){const segs=key.split(".");const last=segs.pop();let cur=obj;
  for(const s of segs){let nx=Array.isArray(cur)?cur.find(x=>x&&x.id===s):cur[s];if(nx==null){nx={};if(!Array.isArray(cur))cur[s]=nx}cur=nx}
  if(Array.isArray(cur)){if(/^\d+$/.test(last))cur[+last]=val;return}cur[last]=val}

/* ================= state ================= */
const S={view:"hoje",sub:"semana",date:TODAY(),selCell:null,editHabits:false,mesSide:"rotina",diaryDate:null,decorate:false,selDeco:null,card:{show:false},chatBusy:false,vbEdit:false,panel:null,jNote:null,jMode:"ler",jSearch:"",jConfirm:null};

function routineFor(d){const wd=parse(d).getDay();return get("settings/routine").items.filter(i=>(i.days||[]).includes(wd)).map(i=>({...i,rid:i.id}))}

/* ================= shared renderers ================= */
function ransom(word,h){
  const map={h:["L-h"],o:["L-o","L-o2","L-o3"],j:["L-j"],e:["L-e","L-e2","L-e3"],s:["L-s","L-s2"],a:["L-a","L-a2"],m:["L-m","L-m2"],n:["L-n","L-n2"],p:["L-p"],l:["L-l"],r:["L-r","L-r2"],c:["L-c"],t:["L-t"],u:["L-u","L-u2"],d:["L-d","L-d2"],i:["L-i","L-i2"],v:["L-v"]};
  const used={};let seed=word.length*7+word.charCodeAt(0);
  return '<span class="ransom" role="img" aria-label="'+word+'">'+[...word].map(c=>{const o=map[c];if(!o)return"";const k=(used[c]=(used[c]||0)+1)-1;seed=(seed*9301+49297)%233280;const r=(seed/233280*12-6).toFixed(1),dy=(seed%9)-4;
    return '<img src="img/'+o[k%o.length]+'.webp" alt="" style="transform:translateY('+dy+'px) rotate('+r+'deg)'+(h?';height:'+h+'px':'')+'">'}).join("")+'</span>';
}

/* ================= PLANNER · MÊS ================= */
function arc(cx,cy,r0,r1,a0,a1){const pt=(r,a)=>{a=(a-90)*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]};const[x0,y0]=pt(r1,a0),[x1,y1]=pt(r1,a1),[x2,y2]=pt(r0,a1),[x3,y3]=pt(r0,a0),lg=a1-a0>180?1:0;
  return "M"+x0.toFixed(1)+","+y0.toFixed(1)+" A"+r1+","+r1+" 0 "+lg+" 1 "+x1.toFixed(1)+","+y1.toFixed(1)+" L"+x2.toFixed(1)+","+y2.toFixed(1)+" A"+r0+","+r0+" 0 "+lg+" 0 "+x3.toFixed(1)+","+y3.toFixed(1)+" Z"}
function dialSVG(m,ym){
  const H=m.habits, cx=300, cy=262, r0=78, rw=26, seg=9, n=new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate();
  const cols=["#9E182B","#E07A90","#F2AFBC","#D9B8A3","#3A2E2E"], tcol=["#9E182B","#C2566E","#C9677F","#9C7A66","#3A2E2E"];
  const t=TODAY(), tday=t.slice(0,7)===ym?+t.slice(8):-1;
  let s='<svg class="dial" viewBox="0 0 560 500" role="img" aria-label="rotina do mês">';
  H.forEach((name,hi)=>{const ri=r0+(H.length-1-hi)*rw, ro=ri+rw;
    for(let d=0;d<n;d++){const on=!!m.marks[hi+"-"+(d+1)];s+='<path class="seg" data-act="mark" data-k="'+hi+'-'+(d+1)+'" d="'+arc(cx,cy,ri,ro,d*seg,(d+1)*seg)+'" fill="'+(on?cols[hi%5]:"#FFFBF9")+'" stroke="#7A6A68" stroke-width=".7"><title>'+esc(name)+' · dia '+(d+1)+'</title></path>'}
    s+='<line x1="40" y1="'+(cy-ro)+'" x2="'+cx+'" y2="'+(cy-ro)+'" stroke="#7A6A68" stroke-width=".7"/><text x="44" y="'+(cy-ri-rw/2+4)+'" font-family="Nothing You Could Do, cursive" font-size="13" fill="'+tcol[hi%5]+'">'+esc(name)+'</text>'});
  s+='<line x1="40" y1="'+(cy-r0)+'" x2="'+cx+'" y2="'+(cy-r0)+'" stroke="#7A6A68" stroke-width=".7"/>';
  const pt=(r,a)=>{a=(a-90)*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]};
  for(let d=0;d<n;d++){const a=(d+.5)*seg,[tx,ty]=pt(r0+H.length*rw+14,a);s+='<text x="'+tx.toFixed(1)+'" y="'+ty.toFixed(1)+'" text-anchor="middle" dominant-baseline="middle" font-family="Instrument Sans, sans-serif" font-size="10.5" font-weight="'+(d+1===tday?700:400)+'" fill="'+(d+1===tday?"#9E182B":"#3A2E2E")+'" transform="rotate('+a.toFixed(1)+' '+tx.toFixed(1)+' '+ty.toFixed(1)+')">'+(d+1)+'</text>'}
  if(tday>0)s+='<path d="'+arc(cx,cy,r0,r0+H.length*rw,(tday-1)*seg,tday*seg)+'" fill="none" stroke="#9E182B" stroke-width="2" pointer-events="none"/>';
  return s+'</svg>';
}
function wheelSVG(m,prev){
  const cx=230,cy=210,R=150,n=WHEEL.length,step=360/n;
  let s='<svg class="dial" viewBox="0 0 460 430" role="img" aria-label="roda da vida">';
  WHEEL.forEach((a,i)=>{const v=m.wheel[a]||0;
    for(let k=1;k<=10;k++){const r0=R*(k-1)/10,r1=R*k/10,on=k<=v;s+='<path class="seg" data-act="wheel" data-a="'+a+'" data-v="'+k+'" d="'+arc(cx,cy,Math.max(r0,.01),r1,i*step+.6,(i+1)*step-.6)+'" fill="'+(on?(v<=4?"#9E182B":(i%2?"#E07A90":"#F2AFBC")):"#FFFBF9")+'" stroke="#D9C8C4" stroke-width=".6" style="cursor:pointer"><title>'+a+' · '+k+'</title></path>'}
    const am=(i+.5)*step,rad=(am-90)*Math.PI/180,lx=cx+(R+26)*Math.cos(rad),ly=cy+(R+26)*Math.sin(rad);
    const pv=prev&&prev.wheel&&prev.wheel[a];
    s+='<text x="'+lx.toFixed(0)+'" y="'+(ly+4).toFixed(0)+'" text-anchor="middle" font-family="Instrument Sans, sans-serif" font-size="12" fill="#2B2222">'+a+' '+(v||"–")+(pv?' <tspan fill="#8C7376" font-size="10">('+pv+')</tspan>':'')+'</text>'});
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="#2B2222" stroke-width="1.2"/></svg>';
  return s;
}

const JP="jardim/notes";
const STAGES=[["semente","🌱"],["brotando","🌿"],["florescida","🌸"]];
const STAGE_COL={semente:"#D9B8A3",brotando:"#E07A90",florescida:"#9E182B"};
const linkRe=/\[\[([^\]|#]+)(?:\|([^\]]+))?\]\]/g;
const tagRe=/(^|\s)#([\wÀ-ú-]+)/g;
function jNotes(){return get(JP).notes}
function jByTitle(t){t=(t||"").trim().toLowerCase();return jNotes().find(n=>(n.title||"").trim().toLowerCase()===t)}
function jLinks(n){const out=[];let m;linkRe.lastIndex=0;while((m=linkRe.exec(n.body||"")))out.push(m[1].trim());return out}
function jTags(n){const out=[];let m;tagRe.lastIndex=0;while((m=tagRe.exec(n.body||"")))out.push(m[2]);return out}
function jGraph(){
  const notes=jNotes(),nodes=notes.map(n=>({id:n.id,title:n.title||"sem título",stage:n.stage||"semente",ghost:false})),edges=[],ghosts={};
  notes.forEach(n=>jLinks(n).forEach(t=>{const tgt=jByTitle(t);if(tgt){if(tgt.id!==n.id)edges.push([n.id,tgt.id])}else{const gid="ghost:"+t.toLowerCase();if(!ghosts[gid]){ghosts[gid]=1;nodes.push({id:gid,title:t,ghost:true})}edges.push([n.id,gid])}}));
  return {nodes,edges};
}
let jLayoutCache={key:"",pos:{}};
function jLayout(g,W,H){
  const key=g.nodes.map(n=>n.id).join(",")+"|"+g.edges.map(e=>e.join(">")).join(",");
  if(jLayoutCache.key===key)return jLayoutCache.pos;
  const pos={},hash=s=>{let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))%100003;return h};
  g.nodes.forEach(n=>{const h=hash(n.id);pos[n.id]={x:W/2+((h%200)-100)*1.2,y:H/2+(((h/200|0)%200)-100)*.9,vx:0,vy:0}});
  const N=g.nodes.length;
  for(let it=0;it<220;it++){
    for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){const a=pos[g.nodes[i].id],b=pos[g.nodes[j].id];let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+.01;const f=4200/d2;const d=Math.sqrt(d2);dx/=d;dy/=d;a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f}
    g.edges.forEach(([s,t])=>{const a=pos[s],b=pos[t];if(!a||!b)return;const dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)+.01,f=(d-115)*.02;a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f});
    g.nodes.forEach(n=>{const p=pos[n.id];p.vx+=(W/2-p.x)*.004;p.vy+=(H/2-p.y)*.004;p.x+=Math.max(-12,Math.min(12,p.vx));p.y+=Math.max(-12,Math.min(12,p.vy));p.vx*=.55;p.vy*=.55;p.x=Math.max(24,Math.min(W-24,p.x));p.y=Math.max(18,Math.min(H-18,p.y))});
  }
  jLayoutCache={key,pos};return pos;
}
function jGraphSVG(){
  const g=jGraph(),W=520,H=330;
  if(!g.nodes.length)return '<div class="graph" style="display:flex;align-items:center;justify-content:center;height:220px"><p class="empty">O grafo aparece quando houver notas.</p></div>';
  const pos=jLayout(g,W,H),deg={};g.edges.forEach(([s,t])=>{deg[s]=(deg[s]||0)+1;deg[t]=(deg[t]||0)+1});
  const sel=S.jNote,near=new Set([sel]);g.edges.forEach(([s,t])=>{if(s===sel)near.add(t);if(t===sel)near.add(s)});
  let s='<svg class="dial graph" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="grafo de conexões">';
  g.edges.forEach(([a,b])=>{const p=pos[a],q=pos[b];if(!p||!q)return;const hot=sel&&(a===sel||b===sel);s+='<line x1="'+p.x.toFixed(1)+'" y1="'+p.y.toFixed(1)+'" x2="'+q.x.toFixed(1)+'" y2="'+q.y.toFixed(1)+'" stroke="'+(hot?"#9E182B":"#C9B6B2")+'" stroke-width="'+(hot?1.6:1)+'"/>'});
  g.nodes.forEach(n=>{const p=pos[n.id],r=4+Math.min(8,(deg[n.id]||0)*1.5),dim=sel&&!near.has(n.id),on=n.id===sel;
    s+='<g data-act="'+(n.ghost?"jGhost":"jOpen")+'" data-id="'+esc(n.ghost?n.title:n.id)+'" style="cursor:pointer;opacity:'+(dim?.35:1)+'"><circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+r+'" fill="'+(n.ghost?"#FFFBF9":STAGE_COL[n.stage])+'" stroke="'+(on?"#2B2222":n.ghost?"#B9A3A3":"#FFFBF9")+'" stroke-width="'+(on?2.2:1.2)+'"'+(n.ghost?' stroke-dasharray="2 2"':'')+'/><text x="'+p.x.toFixed(1)+'" y="'+(p.y+r+11).toFixed(1)+'" text-anchor="middle" font-family="Instrument Sans, sans-serif" font-size="10" fill="'+(n.ghost?"#B9A3A3":"#2B2222")+'">'+esc(n.title.length>22?n.title.slice(0,21)+"…":n.title)+'</text></g>'});
  return s+'</svg>';
}
function mdRender(src){
  const lines=esc(src||"").split("\n");let out="",inList=false;
  const inline=t=>t.replace(/\[\[([^\]|#]+)(?:\|([^\]]+))?\]\]/g,(m,a,b)=>'<button class="wl'+(jByTitle(a.replace(/&amp;/g,"&"))?"":" ghost")+'" data-act="jOpenTitle" data-t="'+a.trim()+'">'+(b||a).trim()+'</button>')
    .replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\*([^*]+)\*/g,"<i>$1</i>").replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/(^|\s)#([\wÀ-ú-]+)/g,'$1<span class="tg">#$2</span>');
  for(const l of lines){
    const h=l.match(/^(#{1,3})\s+(.*)/);const li=l.match(/^\s*[-*]\s+(.*)/);
    if(li){if(!inList){out+="<ul>";inList=true}out+="<li>"+inline(li[1])+"</li>";continue}
    if(inList){out+="</ul>";inList=false}
    if(h)out+="<h"+(h[1].length+2)+">"+inline(h[2])+"</h"+(h[1].length+2)+">";
    else if(l.trim()==="")out+="<br>";
    else out+="<p>"+inline(l)+"</p>";
  }
  if(inList)out+="</ul>";return out;
}

function need(){
  const d=S.date,v=S.view,t=TODAY(),P=["settings/routine","jardim/notes","settings/support",dayPath(d),dayPath(addDays(d,1)),dayPath(addDays(d,-1)),dayPath(addDays(d,-2)),monthPath(d),"diario/index"];

const META="fichario:meta";
function metaGet(){try{return JSON.parse(localStorage.getItem(META)||"{}")}catch(e){return{}}}
function metaSet(o){try{localStorage.setItem(META,JSON.stringify({...metaGet(),...o}))}catch(e){}}

function localDownloads(){
  return {save:async({filename,data})=>{
    const type=/\.json$/.test(filename)?"application/json":/\.ics$/.test(filename)?"text/calendar":/\.zip$/.test(filename)?"application/zip":"text/markdown";
    const blob=data instanceof Blob?data:new Blob([data],{type:type+";charset=utf-8"});
    const file=new File([blob],filename,{type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:filename});return}
      catch(e){if(e&&e.name==="AbortError")throw {code:"declined"}}
    }
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);
  }};
}

/* fotos do vision board: guardadas no próprio aparelho (IndexedDB) */
function idb(){return new Promise((ok,no)=>{const r=indexedDB.open("fichario",1);r.onupgradeneeded=()=>r.result.createObjectStore("blobs");r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function idbDo(mode,fn){const d=await idb();return new Promise((ok,no)=>{const tx=d.transaction("blobs",mode),st=tx.objectStore("blobs"),r=fn(st);tx.oncomplete=()=>ok(r&&r.result);tx.onerror=()=>no(tx.error)})}
const blobPut=(id,b)=>idbDo("readwrite",s=>s.put(b,id));
const blobGet=id=>idbDo("readonly",s=>s.get(id));
const blobIds=()=>idbDo("readonly",s=>s.getAllKeys()).then(x=>x||[]);
const blobClear=()=>idbDo("readwrite",s=>s.clear());
function localAssets(){
  return {
    upload:async f=>{
      if(!/^image\//.test(f.type))throw {code:"unsupported_type"};
      const bmp=await createImageBitmap(f),k=Math.min(1,1100/Math.max(bmp.width,bmp.height));
      const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
      const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.82)),id=uid();await blobPut(id,blob);return {id};
    },
    delete:id=>idbDo("readwrite",s=>s.delete(id))
  };
}
const blobUrls={};
async function hydrateBlobs(){
  for(const el of document.querySelectorAll("img[data-blob]")){
    const id=el.dataset.blob;if(el.getAttribute("src"))continue;
    if(!blobUrls[id]){try{const b=await blobGet(id);if(b)blobUrls[id]=URL.createObjectURL(b)}catch(e){}}

  }
}
const toDataURL=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)});

/* lembretes na Agenda do iPhone (.ics com alarmes, no máximo 5 por dia) */
const icsEsc=s=>String(s).replace(/\\/g,"\\\\").replace(/;/g,"\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
function icsFold(line){const enc=new TextEncoder(),out=[];let cur="",n=0;for(const ch of line){const b=enc.encode(ch).length;if(n+b>72){out.push(cur);cur=" "+ch;n=1+b}else{cur+=ch;n+=b}}out.push(cur);return out.join("\r\n")}
const icsDT=(d,t)=>d.replace(/-/g,"")+"T"+t.replace(":","")+"00";
function icsPlus(t,min){const m=Math.min(23*60+59,toMin(t)+min);return pad(Math.floor(m/60))+":"+pad(m%60)}
function icsAlarms(d,ents,leve){
  const cand=[],isMed=e=>e.rid==="med"||/medica/i.test(e.text),isRev=e=>e.rid==="rev"||/revis[aã]o do dia/i.test(e.text);
  ents.filter(e=>e.time).forEach(e=>{
    if(isMed(e))cand.push({p:1,id:e.rid||e.id,before:0,msg:"tomar a medicação"});
    else if(isRev(e))cand.push({p:5,id:e.rid||e.id,before:0,msg:"revisão do dia (30 segundos)"});
    else if(leve)return;
    else if(e.tag==="treino")cand.push({p:2,id:e.rid||e.id,before:15,msg:e.text+" em 15 minutos"});
    else if(e.tag==="estudo"||/^(estudo|cirurgia ·)/i.test(e.text))cand.push({p:3,id:e.rid||e.id,before:0,msg:"hora de estudar: "+e.text});
  });
  const sono=ents.find(e=>e.time&&(e.rid==="sono"||/^dormir/i.test(e.text)));
  if(sono&&!leve)cand.push({p:4,id:sono.rid||sono.id,before:30,msg:"hora de desacelerar: dormir às "+sono.time});
  const eve=!sono&&!leve&&entriesFor(addDays(d,1)).find(e=>e.tag==="treino"&&e.time&&toMin(e.time)<7*60);
  if(eve)cand.push({p:4,id:"eve",before:0,msg:"hora de desacelerar para dormir (treino amanhã às "+eve.time+")",synth:true});
  const keep=cand.sort((a,b)=>a.p-b.p||0).slice(0,5),map={};keep.forEach(k=>map[k.id]=k);return map;
}
function buildICS(dias){
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Fichario//PT-BR//","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Fichário"];
  const stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+Z$/,"Z"),start=TODAY();let n=0;
  const alarm=(a)=>["BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(a.msg),"TRIGGER:"+(a.before?"-PT"+a.before+"M":"PT0S"),"END:VALARM"];
  for(let i=0;i<dias;i++){
    const d=addDays(start,i);watch(dayPath(d));watch(dayPath(addDays(d,1)));watch(monthPath(d));
    const mev=get(monthPath(d)).events||{},nome=mev[String(+d.slice(8))];
    if(nome){n++;L.push("BEGIN:VEVENT","UID:"+d+"-mes@fichario","DTSTAMP:"+stamp,"DTSTART;VALUE=DATE:"+d.replace(/-/g,""),"DTEND;VALUE=DATE:"+addDays(d,1).replace(/-/g,""),"SUMMARY:"+icsEsc(nome),"END:VEVENT")}
    const day=get(dayPath(d)),ents=entriesFor(d).filter(e=>e.time),al=icsAlarms(d,ents,!!day.leve);
    ents.forEach(e=>{const id=e.rid||e.id,a=al[id];n++;
      L.push("BEGIN:VEVENT","UID:"+d+"-"+id+"@fichario","DTSTAMP:"+stamp,"DTSTART:"+icsDT(d,e.time),"DTEND:"+icsDT(d,e.end||icsPlus(e.time,30)),"SUMMARY:"+icsEsc(e.text));
      if(a)L.push(...alarm(a));L.push("END:VEVENT")});
    if(al.eve){n++;L.push("BEGIN:VEVENT","UID:"+d+"-eve@fichario","DTSTAMP:"+stamp,"DTSTART:"+icsDT(d,"20:30"),"DTEND:"+icsDT(d,"20:45"),"SUMMARY:desacelerar para dormir",...alarm(al.eve),"END:VEVENT")}
  }
  L.push("END:VCALENDAR");return {text:L.map(icsFold).join("\r\n")+"\r\n",n};
}
async function exportICS(){
  watch("settings/routine");watch("estudos/main");
  const r=buildICS(56);await saveFile("fichario-lembretes.ics",r.text);metaSet({lastIcs:TODAY()});toast(r.n+" compromissos na Agenda. Toque no arquivo para adicionar.");if(S.panel==="data")openData();
}

  const ok=it=>it&&typeof it.id==="string"&&typeof it.text==="string"&&Array.isArray(it.days)&&(!it.time||/^\d\d:\d\d$/.test(it.time));
  if(!o||o.app!=="fichario"||o.tipo!=="rotina"||!Array.isArray(o.itens)||!o.itens.every(ok)){toast("Esse arquivo não é uma rotina do Fichário.");return}
  const rem=Array.isArray(o.remover)?o.remover:[],ev=o.eventos&&typeof o.eventos==="object"?o.eventos:{};
  for(const ym in ev){if(!/^\d{4}-\d{2}$/.test(ym)||typeof ev[ym]!=="object"||Object.entries(ev[ym]).some(([k,v])=>!/^\d{1,2}$/.test(k)||typeof v!=="string")){toast("Esse arquivo não é uma rotina do Fichário.");return}}
  if(!confirm("Adicionar "+o.itens.length+" itens à sua rotina"+(rem.length?" e substituir "+rem.length+" antigos":"")+"? O resto dos seus dados não muda."))return;
  mut("settings/routine",b=>{const ids=new Set(o.itens.map(i=>i.id));b.items=b.items.filter(i=>!rem.includes(i.id)&&!ids.has(i.id)).concat(o.itens.map(i=>({kind:"task",tag:"",...i})))});
  Object.keys(ev).forEach(ym=>{watch("months/"+ym);mut("months/"+ym,b=>{b.events={...(b.events||{}),...ev[ym]}})});
  toast("Rotina atualizada");if(S.panel==="data")openData();
}

function openRitual(step,mon){
  const cur=S.panel&&S.panel.type==="ritual"?S.panel:{step:0,mon:addDays(mondayOf(TODAY()),7),day:null};
  const P={type:"ritual",step:step!=null?step:cur.step,mon:mon||cur.mon,day:cur.day};S.panel=P;
  const st=RIT[P.step],wp="weeks/"+P.mon,days=[0,1,2,3,4,5,6].map(x=>addDays(P.mon,x));
  watch(wp);days.forEach(x=>watch(dayPath(x)));
  const dt=parse(P.mon),short=x=>DABR[parse(x).getDay()]+" "+pad(parse(x).getDate());
  let body="";
  if(st.prios){const wk=get(wp);body='<div class="lines">'+[0,1,2].map(i=>'<input id="rp'+i+'" data-p="'+wp+'" data-k="prios.'+i+'" value="'+esc(wk.prios[i]||"")+'" placeholder="'+(i+1)+'." aria-label="prioridade '+(i+1)+'">').join("")+'</div>'}
  else if(st.lists){body='<span class="lb">marmitas · preparar no domingo</span>'+items(wp,"marmitas",{ph:"prato ou marmita…"})+'<span class="lb" style="margin-top:8px">lista de compras</span>'+items(wp,"compras",{ph:"item…"})}
  else{
    const rows=days.map(x=>{
      const day=get(dayPath(x)),mine=day.log.filter(l=>l.tag===st.tag).sort((a,b)=>(toMin(a.time)??9999)-(toMin(b.time)??9999));
      const fixed=st.routine?routineFor(x).filter(r=>r.tag==="treino"&&!day.skip[r.rid]):[];
      const lines=fixed.map(r=>'<div class="item" style="grid-template-columns:44px minmax(0,1fr)"><span class="tm">'+esc(r.time||"")+'</span><span class="txt" style="font-size:15px;color:var(--muted)">'+esc(r.text)+' · da rotina</span></div>').join("")+
        mine.map(l=>'<div class="item" style="grid-template-columns:44px minmax(0,1fr) auto"><span class="tm">'+esc(l.time||"—")+'</span><span class="txt" style="font-size:15px">'+esc(l.text)+'</span><button class="x" style="opacity:1" data-act="li-del" data-p="'+dayPath(x)+'" data-k="log" data-id="'+l.id+'" aria-label="apagar">×</button></div>').join("");
      const rest=st.routine&&!fixed.length&&!mine.length;
      return '<div><div class="dh"><b style="font-size:16px">'+short(x)+'</b>'+(rest?'<span class="tag">descanso</span>':'')+'</div>'+lines+'</div>'}).join("");
    body='<div style="display:flex;flex-direction:column;gap:8px">'+rows+'</div>'+
      '<form class="add wrap" data-add="ritualItem"><select id="rt-day" aria-label="dia">'+days.map(x=>'<option value="'+x+'"'+(x===P.day?" selected":"")+'>'+short(x)+'</option>').join("")+'</select><input id="rt-time" type="time" aria-label="início"><input id="rt-end" type="time" aria-label="fim"><input id="rt-text" class="grow" name="t" placeholder="'+esc(st.ph)+'" autocomplete="off" aria-label="texto"><button class="btn b-line" style="height:28px;padding:0 12px" aria-label="adicionar">+</button></form>';
  }
  panel('<div class="between"><span class="script" style="font-size:38px">planejar a semana</span><button class="pill" data-act="closePanel">fechar</button></div>'+
   '<div class="between"><span class="row" style="gap:6px"><button class="iconbtn" data-act="ritualWeek" data-n="-7" aria-label="semana anterior">‹</button><span class="lb">semana de '+dt.getDate()+' de '+MESES[dt.getMonth()]+'</span><button class="iconbtn" data-act="ritualWeek" data-n="7" aria-label="próxima semana">›</button></span><span class="tag">passo '+(P.step+1)+' de '+RIT.length+'</span></div>'+
   '<div><h2 class="h2" style="font-size:24px">'+(P.step+1)+'. '+st.t+'</h2><p style="margin:4px 0 0;color:#5A4547;font-size:13.5px;line-height:1.5">'+st.h+'</p></div>'+body+
   '<div class="row" style="justify-content:space-between;margin-top:6px">'+(P.step>0?'<button class="btn b-line" data-act="ritualStep" data-n="-1">← anterior</button>':'<span></span>')+(P.step<RIT.length-1?'<button class="btn b-wine" data-act="ritualStep" data-n="1">próximo →</button>':'<button class="btn b-wine" data-act="ritualDone">concluir</button>')+'</div>');
  const f=document.getElementById("rt-text");if(f&&P.focus){f.focus();P.focus=false}
}

function pwaInit(){
  if("serviceWorker" in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js").catch(()=>{});
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().then(ok=>metaSet({persist:!!ok})).catch(()=>{});
  setTimeout(()=>{const m=metaGet(),tem=Object.keys(localStorage).some(k=>k.startsWith(LS+"days/"));
    if(tem&&(!m.lastBackup||diffDays(m.lastBackup,TODAY())>=14))toast("Faz tempo sem backup. Abra “dados” e salve um.");
    else if(m.lastIcs&&diffDays(m.lastIcs,TODAY())>=42)toast("Sua Agenda está acabando. Abra “dados” e gere de novo.")},3500);
}
$("#dataBtn").onclick=openData;
$("#routinePick").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];e.target.value="";if(f)importRoutine(f)});
$("#restorePick").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];e.target.value="";if(f)importAll(f)});


/* ================= files ================= */
async function saveFile(name,text){if(!downloads)return;try{await downloads.save({filename:name,data:text});toast("Arquivo pronto")}catch(e){if(e&&e.code!=="declined")toast("Não deu para salvar o arquivo aqui.")}}
function saveMd(d){
  const dt=parse(d),rv=get(dayPath(d)).review,f=v=>v?FACE_N[v-1]:"—";
  saveFile(d+".md","# Belém, "+dt.getDate()+" de "+MESES[dt.getMonth()]+" de "+dt.getFullYear()+"\n\n"+(rv.free||"")+"\n\n## "+qOf(d)+"\n\n"+(rv.answer||"")+"\n\n---\n- treino: "+f(rv.treino)+(rv.treinoTxt?" · "+rv.treinoTxt:"")+"\n- dieta: "+f(rv.dieta)+(rv.dietaTxt?" · "+rv.dietaTxt:"")+"\n- humor: "+f(rv.humor)+"\n");
}

/* ================= boot ================= */
subscribe();render();
setInterval(()=>{if(S.view==="hoje"&&S.date===TODAY()&&!document.activeElement.matches("input,textarea"))render()},60000);
pwaInit();
})();
</script>
